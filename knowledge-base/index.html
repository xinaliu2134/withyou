<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家长知识库 — 同路 WithYou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sage: #6B8F7B;
  --sage-light: #8FB09D;
  --sage-pale: #E8F0EB;
  --sage-dark: #4A6B56;
  --cream: #FAF7F0;
  --cream-dark: #F0EBDF;
  --blue: #7BA7BC;
  --blue-light: #A5C7D6;
  --blue-pale: #E4EFF4;
  --warm-text: #3D3D3D;
  --warm-text-light: #6B6B6B;
  --coral: #D4917B;
  --coral-pale: #F5E0D8;
  --yellow: #C9A84C;
  --yellow-bg: #FDF6E3;
  --red: #C47A6E;
  --red-bg: #F8E8E5;
  --green-bg: #E8F0EB;
  --shadow: 0 2px 16px rgba(107,143,123,0.10);
  --shadow-lg: 0 6px 28px rgba(107,143,123,0.14);
  --radius: 16px;
  --radius-sm: 10px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--warm-text);
  line-height: 1.6;
  min-height: 100vh;
}

.hidden { display: none !important; }
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; }

/* ===== Top Bar ===== */
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--cream-dark);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-back {
  color: var(--sage);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}
.topbar-title { font-size: 0.95rem; font-weight: 600; color: var(--sage); }
.topbar-right { display: flex; gap: 8px; }
.lang-toggle {
  background: var(--sage-pale);
  border: none;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--sage);
  cursor: pointer;
  transition: all 0.2s;
}
.lang-toggle:hover { background: var(--sage-light); color: #fff; }
.lang-toggle.active { background: var(--sage); color: #fff; }

/* ===== Hero ===== */
.hero {
  text-align: center;
  padding: 32px 20px 24px;
}
.hero-icon { font-size: 2.8rem; margin-bottom: 10px; }
.hero h1 { font-size: 1.5rem; font-weight: 700; color: var(--sage-dark); margin-bottom: 4px; }
.hero p { font-size: 0.92rem; color: var(--warm-text-light); max-width: 520px; margin: 0 auto; }

/* ===== Section Nav ===== */
.section-nav {
  display: flex;
  gap: 6px;
  padding: 0 20px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  max-width: 720px;
  margin: 0 auto;
}
.section-nav::-webkit-scrollbar { display: none; }
.nav-pill {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  background: #fff;
  border: 1.5px solid var(--cream-dark);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--warm-text-light);
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}
.nav-pill:hover { border-color: var(--sage-light); color: var(--sage); }

/* ===== Accordion ===== */
.accordion-section {
  margin-bottom: 16px;
}

.accordion-header {
  background: #fff;
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.2s;
  border: 2px solid transparent;
}
.accordion-header:hover { box-shadow: var(--shadow-lg); }
.accordion-section.open .accordion-header { border-color: var(--sage-light); border-radius: var(--radius) var(--radius) 0 0; }

.acc-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.acc-info { flex: 1; }
.acc-title { font-size: 1rem; font-weight: 600; color: var(--warm-text); }
.acc-subtitle { font-size: 0.82rem; color: var(--warm-text-light); margin-top: 2px; }
.acc-arrow { font-size: 1rem; color: var(--warm-text-light); transition: transform 0.3s; }
.accordion-section.open .acc-arrow { transform: rotate(180deg); }

.accordion-body {
  display: none;
  background: #fff;
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 0 20px 20px;
  box-shadow: var(--shadow);
}
.accordion-section.open .accordion-body { display: block; }

/* ===== Content Cards ===== */
.info-card {
  background: var(--cream);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 12px;
}
.info-card h4 {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--sage-dark);
  margin-bottom: 8px;
}
.info-card p, .info-card li {
  font-size: 0.84rem;
  color: var(--warm-text-light);
  line-height: 1.6;
}
.info-card ul, .info-card ol { padding-left: 18px; }
.info-card li { margin-bottom: 4px; }

.highlight-card {
  background: var(--sage-pale);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.highlight-card p {
  font-size: 0.86rem;
  color: var(--sage-dark);
  line-height: 1.6;
  font-style: italic;
}

/* ===== Flip Cards (Myths) ===== */
.myths-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
.flip-card {
  perspective: 800px;
  min-height: 120px;
  cursor: pointer;
}
.flip-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 120px;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}
.flip-card.flipped .flip-inner { transform: rotateY(180deg); }

.flip-front, .flip-back {
  position: absolute;
  width: 100%;
  min-height: 120px;
  backface-visibility: hidden;
  border-radius: var(--radius-sm);
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.flip-front {
  background: var(--red-bg);
  border: 2px solid var(--red);
}
.flip-back {
  background: var(--green-bg);
  border: 2px solid var(--sage);
  transform: rotateY(180deg);
}
.flip-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.flip-front .flip-label { color: var(--red); }
.flip-back .flip-label { color: var(--sage); }
.flip-text {
  font-size: 0.86rem;
  line-height: 1.5;
}
.flip-front .flip-text { color: var(--warm-text); }
.flip-back .flip-text { color: var(--warm-text); }
.flip-hint {
  font-size: 0.72rem;
  color: var(--warm-text-light);
  margin-top: 8px;
  text-align: right;
}

/* Fix flip card height */
.flip-card, .flip-inner, .flip-front, .flip-back {
  min-height: auto;
}
.flip-front, .flip-back {
  position: relative;
}
.flip-back {
  position: absolute;
  top: 0;
  left: 0;
}

/* ===== Treatment Cards ===== */
.treatment-good {
  background: var(--green-bg);
  border-left: 4px solid var(--sage);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 10px;
}
.treatment-bad {
  background: var(--red-bg);
  border-left: 4px solid var(--red);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 10px;
}
.treatment-good h4 { color: var(--sage-dark); font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
.treatment-bad h4 { color: var(--red); font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
.treatment-good p, .treatment-bad p { font-size: 0.82rem; color: var(--warm-text-light); line-height: 1.5; }

.warning-box {
  background: var(--yellow-bg);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-top: 12px;
}
.warning-box h4 { color: var(--yellow); font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; }
.warning-box ul { padding-left: 16px; }
.warning-box li { font-size: 0.82rem; color: var(--warm-text-light); margin-bottom: 3px; }

/* ===== Script Cards (Telling) ===== */
.script-card {
  background: var(--blue-pale);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 12px;
}
.script-card h4 { color: var(--blue); font-size: 0.88rem; font-weight: 600; margin-bottom: 8px; }
.script-quote {
  font-size: 0.84rem;
  color: var(--warm-text);
  font-style: italic;
  line-height: 1.6;
  border-left: 3px solid var(--blue-light);
  padding-left: 12px;
  margin-bottom: 8px;
}
.script-note { font-size: 0.78rem; color: var(--warm-text-light); }

/* ===== Resource Links ===== */
.resource-group { margin-bottom: 16px; }
.resource-group h4 {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--sage-dark);
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--cream-dark);
}
.resource-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--cream-dark);
}
.resource-item:last-child { border-bottom: none; }
.resource-icon { font-size: 1.1rem; flex-shrink: 0; }
.resource-info { flex: 1; }
.resource-name { font-size: 0.84rem; font-weight: 500; color: var(--warm-text); }
.resource-desc { font-size: 0.76rem; color: var(--warm-text-light); }
.resource-tag {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 8px;
  background: var(--cream-dark);
  color: var(--warm-text-light);
  flex-shrink: 0;
}

/* ===== Responsive ===== */
@media (max-width: 480px) {
  .hero h1 { font-size: 1.3rem; }
  .accordion-header { padding: 14px 16px; }
}
</style>
</head>

// ===== State =====
let currentLang = localStorage.getItem('withyou-lang') || 'zh';
let openSections = new Set();

// ===== Language =====
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('withyou-lang', lang);
  document.querySelectorAll('.lang-toggle').forEach(b => b.classList.toggle('active', b.textContent.trim() === (lang === 'zh' ? '中文' : 'EN')));
  document.querySelectorAll('[data-zh]').forEach(el => el.textContent = el.getAttribute('data-' + lang));
  renderNav();
  renderSections();
}

// ===== Nav =====
function renderNav() {
  const nav = document.getElementById('sectionNav');
  nav.innerHTML = SECTIONS.map(s => {
    const d = s[currentLang];
    return `<a class="nav-pill" href="#section-${s.id}" onclick="openAndScroll('${s.id}')">${d.title}</a>`;
  }).join('');
}

function openAndScroll(id) {
  openSections.add(id);
  renderSections();
  setTimeout(() => {
    document.getElementById('section-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

// ===== Render =====
function renderSections() {
  const area = document.getElementById('contentArea');
  const lang = currentLang;

  area.innerHTML = SECTIONS.map(s => {
    const d = s[lang];
    const isOpen = openSections.has(s.id);
    let bodyContent = d.content;

    // Special renderers
    if (d.content === 'MYTHS') bodyContent = renderMyths(lang);
    else if (d.content === 'TREATMENTS') bodyContent = renderTreatments(lang);
    else if (d.content === 'TELLING') bodyContent = renderTelling(lang);
    else if (d.content === 'SUPPORT') bodyContent = renderSupport(lang);

    return `<div class="accordion-section ${isOpen ? 'open' : ''}" id="section-${s.id}">
      <div class="accordion-header" onclick="toggleSection('${s.id}')">
        <div class="acc-icon" style="background:${s.iconBg}">${s.icon}</div>
        <div class="acc-info">
          <div class="acc-title">${d.title}</div>
          <div class="acc-subtitle">${d.subtitle}</div>
        </div>
        <div class="acc-arrow">&#9660;</div>
      </div>
      <div class="accordion-body">${bodyContent}</div>
    </div>`;
  }).join('');
}

function toggleSection(id) {
  if (openSections.has(id)) openSections.delete(id);
  else openSections.add(id);
  renderSections();
}

// ===== Myths Renderer =====
function renderMyths(lang) {
  const data = MYTHS[lang];
  const tapHint = lang === 'zh' ? '点击翻转' : 'Tap to flip';
  const mythLabel = lang === 'zh' ? '误解' : 'MYTH';
  const truthLabel = lang === 'zh' ? '真相' : 'TRUTH';

  return `<div class="myths-grid">${data.map((m, i) => `
    <div class="flip-card" onclick="this.classList.toggle('flipped')">
      <div class="flip-inner">
        <div class="flip-front">
          <div class="flip-label">&#10060; ${mythLabel}</div>
          <div class="flip-text">${m.myth}</div>
          <div class="flip-hint">${tapHint} &#8594;</div>
        </div>
        <div class="flip-back">
          <div class="flip-label">&#9989; ${truthLabel}</div>
          <div class="flip-text">${m.truth}</div>
        </div>
      </div>
    </div>
  `).join('')}</div>`;
}

  const d = TREATMENTS[lang];

  return `
    <h3 style="font-size:0.95rem;font-weight:600;color:var(--sage-dark);margin-bottom:12px">&#9989; ${goodTitle}</h3>
    ${d.good.map(t => `<div class="treatment-good"><h4>${t.title}</h4><p>${t.desc}</p></div>`).join('')}
    <h3 style="font-size:0.95rem;font-weight:600;color:var(--red);margin:20px 0 12px">&#9888; ${badTitle}</h3>

    : '<div class="highlight-card"><p>Telling others about your child\'s diagnosis is a process, not a single conversation. Here are some scripts you can adapt to your situation. Remember: you don\'t owe everyone an explanation.</p></div>';

  return intro + data.map(s => `
    <div class="script-card">
      <h4>${s.who}</h4>
      <div class="script-quote">${s.quote}</div>
      <div class="script-note">${s.note}</div>
    </div>
  `).join('');
}

// ===== Support Renderer =====
function renderSupport(lang) {
  const d = SUPPORT[lang];
  const labels = lang === 'zh'
    ? { communities: '在线社区', books: '推荐书籍', podcasts: '播客节目', orgs: '各国组织' }
    : { communities: 'Online Communities', books: 'Recommended Books', podcasts: 'Podcasts', orgs: 'Organizations by Country' };

  return `
    <div class="resource-group">
      <h4>&#128101; ${labels.communities}</h4>
      ${d.communities.map(r => `<div class="resource-item"><span class="resource-icon">&#128172;</span><div class="resource-info"><div class="resource-name">${r.name}</div><div class="resource-desc">${r.desc}</div></div><span class="resource-tag">${r.tag}</span></div>`).join('')}
    </div>
    <div class="resource-group">
      <h4>&#128214; ${labels.books}</h4>
      ${d.books.map(r => `<div class="resource-item"><span class="resource-icon">&#128218;</span><div class="resource-info"><div class="resource-name">${r.name}</div><div class="resource-desc">${r.desc}</div></div></div>`).join('')}
    </div>
    <div class="resource-group">
      <h4>&#127911; ${labels.podcasts}</h4>
      ${d.podcasts.map(r => `<div class="resource-item"><span class="resource-icon">&#127911;</span><div class="resource-info"><div class="resource-name">${r.name}</div><div class="resource-desc">${r.desc}</div></div><span class="resource-tag">${r.tag}</span></div>`).join('')}
    </div>
    <div class="resource-group">
      <h4>&#127963; ${labels.orgs}</h4>
      ${d.orgs.map(r => `<div class="resource-item"><span class="resource-icon">&#127760;</span><div class="resource-info"><div class="resource-name">${r.name}</div><div class="resource-desc">${r.desc}</div></div><span class="resource-tag">${r.country}</span></div>`).join('')}
    </div>
  `;
}

// ===== Init =====
setLang(currentLang);
</script>
