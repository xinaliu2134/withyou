<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随身工具包 — 同路 WithYou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sage: #6B8F7B;
  --sage-light: #8FB09D;
  --sage-pale: #E8F0EB;
  --sage-dark: #4A6B56;
  --cream: #FAF7F0;
  --cream-dark: #F0EBDF;
  --blue: #7BA7BC;
  --blue-light: #A5C7D6;
  --blue-pale: #E4EFF4;
  --warm-text: #3D3D3D;
  --warm-text-light: #6B6B6B;
  --coral: #D4917B;
  --coral-pale: #F5E0D8;
  --yellow: #C9A84C;
  --yellow-bg: #FDF6E3;
  --red: #C47A6E;
  --red-bg: #F8E8E5;
  --green-bg: #E8F0EB;
  --shadow: 0 2px 16px rgba(107,143,123,0.10);
  --shadow-lg: 0 6px 28px rgba(107,143,123,0.14);
  --radius: 16px;
  --radius-sm: 10px;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--warm-text);
  line-height: 1.6;
  min-height: 100vh;
}
.hidden { display: none !important; }

/* ===== Top Bar ===== */
.topbar {
  background: #fff; border-bottom: 1px solid var(--cream-dark);
  padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-back { color: var(--sage); text-decoration: none; font-size: 0.88rem; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.topbar-title { font-size: 0.95rem; font-weight: 600; color: var(--sage); }
.lang-toggle {
  background: var(--sage-pale); border: none; border-radius: 20px; padding: 4px 12px;
  font-size: 0.78rem; font-weight: 500; color: var(--sage); cursor: pointer; transition: background 0.2s;
}
.lang-toggle:hover { background: var(--sage-light); color: #fff; }

/* ===== Tabs ===== */
.tabs {
  display: flex; gap: 4px; padding: 16px 20px 0; max-width: 680px; margin: 0 auto;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab {
  padding: 10px 14px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  font-size: 0.78rem; font-weight: 500; background: var(--cream-dark);
  color: var(--warm-text-light); border: none; cursor: pointer; white-space: nowrap; transition: all 0.2s;
}
.tab.active { background: #fff; color: var(--sage); font-weight: 600; }

/* ===== Panel ===== */
.panel {
  background: #fff; border-radius: 0 0 var(--radius) var(--radius);
  padding: 24px 20px; margin: 0 auto; max-width: 680px; min-height: 400px; box-shadow: var(--shadow);
}

/* ===== Card ===== */
.card {
  background: #fff; border: 1px solid var(--cream-dark); border-radius: var(--radius-sm);
  padding: 16px; margin-bottom: 12px;
}
.card-title { font-size: 0.92rem; font-weight: 600; color: var(--sage-dark); margin-bottom: 8px; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 24px; border-radius: var(--radius-sm); font-size: 0.92rem;
  font-weight: 600; font-family: inherit; border: none; cursor: pointer; transition: all 0.2s;
}
.btn-primary { background: var(--sage); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--sage-dark); }
.btn-secondary { background: #fff; color: var(--sage); border: 2px solid var(--sage-pale); }
.btn-secondary:hover { background: var(--sage-pale); }
.btn-small { padding: 8px 16px; font-size: 0.82rem; }
.btn-danger { background: var(--red-bg); color: var(--red); border: none; }

/* ===== Form ===== */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--warm-text); }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 12px 14px; border: 2px solid var(--cream-dark);
  border-radius: var(--radius-sm); font-size: 0.92rem; font-family: inherit;
  color: var(--warm-text); background: #fff; outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--sage-light); }
.form-textarea { resize: vertical; min-height: 60px; }

.section-title { font-size: 1.05rem; font-weight: 600; color: var(--sage-dark); margin-bottom: 8px; }
.section-sub { font-size: 0.82rem; color: var(--warm-text-light); margin-bottom: 16px; }

/* ===== Explain Card ===== */
.explain-card-preview {
  border: 2px solid var(--sage); border-radius: var(--radius-sm);
  padding: 16px; max-width: 340px; margin: 0 auto 16px; font-size: 0.82rem;
  line-height: 1.5; background: #fff;
}
.explain-card-preview .ec-title {
  font-weight: 700; color: var(--sage-dark); margin-bottom: 8px; text-align: center;
  font-size: 0.88rem;
}
.explain-card-preview .ec-body { color: var(--warm-text); }
.explain-card-preview .ec-custom { font-style: italic; color: var(--sage); margin-top: 8px; }

.lang-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.lang-chip {
  padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 500;
  border: 2px solid var(--cream-dark); background: #fff; color: var(--warm-text-light);
  cursor: pointer; transition: all 0.2s;
}
.lang-chip.active { background: var(--sage-pale); border-color: var(--sage); color: var(--sage-dark); }

.template-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tpl-chip {
  padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 500;
  border: 2px solid var(--cream-dark); background: #fff; color: var(--warm-text-light);
  cursor: pointer; transition: all 0.2s;
}
.tpl-chip.active { background: var(--blue-pale); border-color: var(--blue); color: var(--blue); }

/* ===== Emergency Info Card ===== */
.emergency-card {
  border: 3px solid var(--red); border-radius: var(--radius); padding: 20px;
  max-width: 400px; margin: 0 auto; background: #fff;
}
.ec-header { text-align: center; background: var(--red); color: #fff; padding: 10px; border-radius: var(--radius-sm); margin: -20px -20px 16px; font-weight: 700; }
.ec-row { display: flex; gap: 12px; margin-bottom: 10px; }
.ec-row .form-group { flex: 1; margin-bottom: 0; }
.ec-label { font-size: 0.78rem; font-weight: 600; color: var(--red); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

/* ===== Sensory Bag ===== */
.bag-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-bottom: 1px solid var(--cream-dark); font-size: 0.88rem;
}
.bag-item:last-child { border-bottom: none; }
.bag-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--sage); flex-shrink: 0; }
.bag-item .item-text { flex: 1; }
.bag-item .remove-btn { color: var(--red); cursor: pointer; font-size: 0.78rem; }

/* ===== Calming Cards ===== */
.calming-card {
  background: linear-gradient(135deg, var(--sage-pale), var(--blue-pale));
  border-radius: var(--radius); padding: 28px 20px; text-align: center;
  min-height: 180px; display: flex; flex-direction: column; justify-content: center;
  margin-bottom: 16px;
}
.calming-icon { font-size: 3rem; margin-bottom: 12px; }
.calming-title { font-size: 1.1rem; font-weight: 700; color: var(--sage-dark); margin-bottom: 8px; }
.calming-desc { font-size: 0.88rem; color: var(--warm-text); max-width: 360px; margin: 0 auto; }
.calming-nav { display: flex; justify-content: center; gap: 16px; }
.calming-nav button {
  background: var(--sage); color: #fff; border: none; border-radius: 50%;
  width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; transition: all 0.2s;
}
.calming-nav button:hover { background: var(--sage-dark); }

/* ===== Contacts ===== */
.contact-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; border-bottom: 1px solid var(--cream-dark);
}
.contact-item:last-child { border-bottom: none; }
.contact-role { font-size: 0.78rem; color: var(--warm-text-light); }
.contact-name { font-weight: 500; font-size: 0.88rem; }
.contact-phone { font-size: 0.85rem; color: var(--sage); }

/* ===== Timer ===== */
.timer-container { text-align: center; padding: 20px; }
.timer-circle {
  width: 200px; height: 200px; margin: 0 auto 20px; position: relative;
}
.timer-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-circle .bg { fill: none; stroke: var(--cream-dark); stroke-width: 8; }
.timer-circle .progress { fill: none; stroke: var(--sage); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.timer-display {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 2.5rem; font-weight: 700; color: var(--sage-dark);
}
.timer-controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.timer-preset {
  padding: 8px 16px; border-radius: 20px; font-size: 0.82rem; font-weight: 500;
  border: 2px solid var(--cream-dark); background: #fff; color: var(--warm-text);
  cursor: pointer; transition: all 0.2s;
}
.timer-preset.active { background: var(--sage-pale); border-color: var(--sage); color: var(--sage-dark); }

@media print {
  .topbar, .tabs, .btn, .timer-controls, .calming-nav, .lang-chips, .template-chips { display: none !important; }
  .panel { box-shadow: none; border: 1px solid #ddd; }
  .explain-card-preview, .emergency-card { page-break-inside: avoid; border: 2px solid #333; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">&#8592; <span data-i18n="back">返回</span></a>
    <span class="topbar-title" data-i18n="title">随身工具包</span>
  </div>
  <button class="lang-toggle" onclick="toggleLang()">EN / 中</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('explain')" data-i18n="tab_explain">解释卡</button>
  <button class="tab" onclick="showTab('emergency')" data-i18n="tab_emergency">紧急卡</button>
  <button class="tab" onclick="showTab('bag')" data-i18n="tab_bag">感觉包</button>
  <button class="tab" onclick="showTab('calming')" data-i18n="tab_calming">安抚策略</button>
  <button class="tab" onclick="showTab('contacts')" data-i18n="tab_contacts">重要号码</button>
  <button class="tab" onclick="showTab('timer')" data-i18n="tab_timer">计时器</button>
</div>

<!-- ==================== EXPLAIN CARDS ==================== -->
<div class="panel" id="panel-explain">
  <div class="section-title" data-i18n="explain_title">解释卡</div>
  <p class="section-sub" data-i18n="explain_sub">帮助他人理解的卡片，钱包大小可打印</p>

  <div class="form-group">
    <div class="form-label" data-i18n="card_template">选择模板</div>
    <div class="template-chips" id="explain-tpl-chips"></div>
  </div>

  <div class="form-group">
    <div class="form-label" data-i18n="card_lang">卡片语言</div>
    <div class="lang-chips" id="explain-lang-chips"></div>
  </div>

  <div class="form-group">
    <div class="form-label" data-i18n="child_name">孩子的名字</div>
    <input class="form-input" id="explain-name" oninput="renderExplainCard()" placeholder="">
  </div>
  <div class="form-group">
    <div class="form-label" data-i18n="custom_line">自定义说明</div>
    <input class="form-input" id="explain-custom" oninput="renderExplainCard()" placeholder="">
  </div>

  <div class="explain-card-preview" id="explain-preview"></div>

  <button class="btn btn-primary" onclick="window.print()" data-i18n="print_card">打印卡片</button>
</div>

<!-- ==================== EMERGENCY INFO CARD ==================== -->
<div class="panel hidden" id="panel-emergency">
  <div class="section-title" data-i18n="emg_title">紧急信息卡</div>
  <p class="section-sub" data-i18n="emg_sub">可打印的层压卡片大小</p>

  <div class="emergency-card" id="emergency-card-form">
    <div class="ec-header" data-i18n="emg_header">紧急信息 EMERGENCY INFO</div>
    <div class="form-group"><div class="ec-label" data-i18n="emg_name">姓名</div><input class="form-input" id="emg-name" oninput="saveEmergencyCard()"></div>
    <div class="form-group"><div class="ec-label" data-i18n="emg_diagnosis">诊断</div><input class="form-input" id="emg-diagnosis" oninput="saveEmergencyCard()"></div>
    <div class="ec-row">
      <div class="form-group"><div class="ec-label" data-i18n="emg_meds">药物</div><input class="form-input" id="emg-meds" oninput="saveEmergencyCard()"></div>
      <div class="form-group"><div class="ec-label" data-i18n="emg_allergies">过敏</div><input class="form-input" id="emg-allergies" oninput="saveEmergencyCard()"></div>
    </div>
    <div class="ec-row">
      <div class="form-group"><div class="ec-label" data-i18n="emg_contact1">紧急联系人1</div><input class="form-input" id="emg-c1" oninput="saveEmergencyCard()"></div>
      <div class="form-group"><div class="ec-label" data-i18n="emg_contact2">紧急联系人2</div><input class="form-input" id="emg-c2" oninput="saveEmergencyCard()"></div>
    </div>
    <div class="form-group"><div class="ec-label" data-i18n="emg_doctor">医生/医院</div><input class="form-input" id="emg-doctor" oninput="saveEmergencyCard()"></div>
    <div class="form-group"><div class="ec-label" data-i18n="emg_found">如果发现孩子独处</div><textarea class="form-textarea" id="emg-found" rows="3" oninput="saveEmergencyCard()"></textarea></div>
  </div>
  <div style="height:16px;"></div>
  <button class="btn btn-primary" onclick="window.print()" data-i18n="print_card">打印卡片</button>
</div>

<!-- ==================== SENSORY BAG ==================== -->
<div class="panel hidden" id="panel-bag">
  <div class="section-title" data-i18n="bag_title">感觉包清单</div>
  <p class="section-sub" data-i18n="bag_sub">出门前检查感觉包是否打包完成</p>

  <div id="bag-list"></div>

  <div style="display:flex;gap:8px;margin-top:12px;">
    <input class="form-input" id="bag-custom" placeholder="">
    <button class="btn btn-secondary btn-small" onclick="addBagItem()" data-i18n="add_btn">添加</button>
  </div>
</div>

<!-- ==================== CALMING STRATEGIES ==================== -->
<div class="panel hidden" id="panel-calming">
  <div class="section-title" data-i18n="calm_title">安抚策略快速参考</div>
  <p class="section-sub" data-i18n="calm_sub">翻转卡片查看不同策略</p>

  <div class="calming-card" id="calming-card"></div>
  <div class="calming-nav">
    <button onclick="prevCalm()">&#8592;</button>
    <button onclick="nextCalm()">&#8594;</button>
  </div>
  <div style="text-align:center;margin-top:8px;font-size:0.78rem;color:var(--warm-text-light);" id="calm-counter"></div>
</div>

<!-- ==================== IMPORTANT NUMBERS ==================== -->
<div class="panel hidden" id="panel-contacts">
  <div class="section-title" data-i18n="contacts_title">重要联系号码</div>
  <p class="section-sub" data-i18n="contacts_sub">可编辑的联系人列表</p>

  <div id="contacts-list"></div>

  <div class="card" style="margin-top:12px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <input class="form-input" id="contact-role" style="flex:1;min-width:80px" placeholder="">
      <input class="form-input" id="contact-name" style="flex:1;min-width:80px" placeholder="">
      <input class="form-input" id="contact-phone" style="flex:1;min-width:100px" placeholder="" type="tel">
      <button class="btn btn-primary btn-small" onclick="addContact()" data-i18n="add_btn">添加</button>
    </div>
  </div>
</div>

<!-- ==================== QUICK TIMER ==================== -->
<div class="panel hidden" id="panel-timer">
  <div class="section-title" data-i18n="timer_title">视觉倒计时</div>
  <p class="section-sub" data-i18n="timer_sub">简单的圆形动画倒计时，温和提示音</p>

  <div class="timer-controls" id="timer-presets"></div>

  <div class="timer-container">
    <div class="timer-circle">
      <svg viewBox="0 0 200 200">
        <circle class="bg" cx="100" cy="100" r="90"/>
        <circle class="progress" id="timer-progress" cx="100" cy="100" r="90"
          stroke-dasharray="565.48" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-display" id="timer-display">0:00</div>
    </div>
  </div>

  <div style="display:flex;gap:8px;justify-content:center;">
    <button class="btn btn-primary" style="width:auto;padding:12px 32px;" onclick="startTimer()" id="timer-start-btn" data-i18n="start">开始</button>
    <button class="btn btn-secondary" style="padding:12px 32px;" onclick="resetTimer()" data-i18n="reset">重置</button>
  </div>
</div>

<div style="height:40px;"></div>

function t(key) { return I18N[lang][key] || key; }
function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (I18N[lang][k]) el.textContent = I18N[lang][k];
  });
  const en = document.getElementById('explain-name');
  if (en) en.placeholder = t('name_placeholder');
  const ec = document.getElementById('explain-custom');
  if (ec) ec.placeholder = t('custom_placeholder');
  const bc = document.getElementById('bag-custom');
  if (bc) bc.placeholder = t('bag_placeholder');
  const cr = document.getElementById('contact-role');
  if (cr) cr.placeholder = t('role_placeholder');
  const cn = document.getElementById('contact-name');
  if (cn) cn.placeholder = t('name_placeholder2');
  const cp = document.getElementById('contact-phone');
  if (cp) cp.placeholder = t('phone_placeholder');
}
function toggleLang() { lang = lang === 'zh' ? 'en' : 'zh'; applyLang(); renderAll(); }

function getBagItems() {
  if (data.bagItems === null || data.bagItems === undefined) {
    data.bagItems = [...(t('default_bag'))];
    save();
  }
  return data.bagItems;
}

function renderBag() {
  const items = getBagItems();
  document.getElementById('bag-list').innerHTML = items.map((item, i) => {
    const checked = data.bagChecked[item] ? 'checked' : '';
    return `<div class="bag-item">
      <input type="checkbox" ${checked} onchange="toggleBagItem('${item.replace(/'/g,"\\'")}',this.checked)">
      <span class="item-text">${item}</span>
      <span class="remove-btn" onclick="removeBagItem(${i})">x</span>
    </div>`;
  }).join('');
}

function toggleBagItem(item, checked) {
  data.bagChecked[item] = checked;
  save();
}

function addBagItem() {
  const inp = document.getElementById('bag-custom');
  const v = inp.value.trim();
  if (!v) return;
  getBagItems().push(v);
  save();
  inp.value = '';
  renderBag();
}

function removeBagItem(i) {
  const items = getBagItems();
  const removed = items.splice(i, 1)[0];
  delete data.bagChecked[removed];
  save();
  renderBag();
}

let calmIdx = 0;

function renderCalming() {
  const items = CALMING[lang] || CALMING.en;
  const item = items[calmIdx % items.length];
  document.getElementById('calming-card').innerHTML =
    `<div class="calming-icon">${item.icon}</div>
     <div class="calming-title">${item.title}</div>
     <div class="calming-desc">${item.desc}</div>`;
  document.getElementById('calm-counter').textContent = `${(calmIdx % items.length) + 1} / ${items.length}`;

function nextCalm() { calmIdx++; renderCalming(); }
function prevCalm() { calmIdx = calmIdx > 0 ? calmIdx - 1 : (CALMING[lang] || CALMING.en).length - 1; renderCalming(); }

function addContact() {
  const role = document.getElementById('contact-role').value.trim();
  const name = document.getElementById('contact-name').value.trim();
  const phone = document.getElementById('contact-phone').value.trim();
  if (!role) return;
  getContacts().push({ role, name, phone, id: Date.now() });
  save();
  document.getElementById('contact-role').value = '';
  document.getElementById('contact-name').value = '';
  document.getElementById('contact-phone').value = '';
  renderContacts();
}

function editContact(id) {
  const contacts = getContacts();
  const c = contacts.find(c => c.id === id);
  if (!c) return;
  const name = prompt(lang === 'zh' ? '姓名:' : 'Name:', c.name);
  if (name !== null) c.name = name;
  const phone = prompt(lang === 'zh' ? '电话:' : 'Phone:', c.phone);
  if (phone !== null) c.phone = phone;
  save();
  renderContacts();
}

function deleteContact(id) {
  if (!confirm(t('delete_confirm'))) return;
  data.contacts = data.contacts.filter(c => c.id !== id);
  save();
  renderContacts();
}

// ===================================================================
//  QUICK TIMER
// ===================================================================
const PRESETS = [1,2,3,5,10,15,20,30];
let timerTotal = 5 * 60;
let timerRemaining = 0;
let timerInterval = null;
let timerRunning = false;

function renderTimerPresets() {
  document.getElementById('timer-presets').innerHTML = PRESETS.map(m =>
    `<span class="timer-preset ${timerTotal === m*60 ? 'active' : ''}" onclick="setTimerPreset(${m})">${m}${lang==='zh'?'分':'m'}</span>`
  ).join('');
}

function setTimerPreset(min) {
  if (timerRunning) return;
  timerTotal = min * 60;
  timerRemaining = timerTotal;
  updateTimerDisplay();
  renderTimerPresets();
}

function updateTimerDisplay() {
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  document.getElementById('timer-display').textContent = `${m}:${s.toString().padStart(2,'0')}`;

  const circumference = 2 * Math.PI * 90;
  const offset = circumference * (1 - timerRemaining / timerTotal);
  document.getElementById('timer-progress').style.strokeDashoffset = offset;
}

function startTimer() {
  if (timerRunning) {
    // Pause
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('timer-start-btn').textContent = t('start');
    return;
  }

  if (timerRemaining <= 0) timerRemaining = timerTotal;
  timerRunning = true;
  document.getElementById('timer-start-btn').textContent = t('pause');

  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timer-start-btn').textContent = t('start');
      playChime();
    }
  }, 1000);
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerRemaining = timerTotal;
  updateTimerDisplay();
  document.getElementById('timer-start-btn').textContent = t('start');
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.value = 0.15;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5 + i * 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.3);
      osc.stop(ctx.currentTime + 1.8 + i * 0.3);
    });
  } catch(e) {}
}

// ===================================================================
//  RENDER ALL
// ===================================================================
function renderAll() {
  applyLang();
  renderExplainCard();
  loadEmergencyCard();
  renderBag();
  renderCalming();
  renderContacts();
  renderTimerPresets();
  if (!timerRunning) { timerRemaining = timerTotal; updateTimerDisplay(); }
}

// ===================================================================
//  INIT
// ===================================================================
load();
timerRemaining = timerTotal;
renderAll();
</script>
