<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视觉日程构建器 — 同路 WithYou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sage: #6B8F7B;
  --sage-light: #8FB09D;
  --sage-pale: #E8F0EB;
  --sage-dark: #4A6B56;
  --cream: #FAF7F0;
  --cream-dark: #F0EBDF;
  --blue: #7BA7BC;
  --blue-light: #A5C7D6;
  --blue-pale: #E4EFF4;
  --warm-text: #3D3D3D;
  --warm-text-light: #6B6B6B;
  --coral: #D4917B;
  --coral-pale: #F5E0D8;
  --yellow: #C9A84C;
  --yellow-bg: #FDF6E3;
  --red: #C47A6E;
  --red-bg: #F8E8E5;
  --green-bg: #E8F0EB;
  --shadow: 0 2px 16px rgba(107,143,123,0.10);
  --shadow-lg: 0 6px 28px rgba(107,143,123,0.14);
  --radius: 16px;
  --radius-sm: 10px;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--cream); color: var(--warm-text); line-height: 1.6; min-height: 100vh;
}
.hidden { display: none !important; }

.topbar {
  background: #fff; border-bottom: 1px solid var(--cream-dark); padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-back { color: var(--sage); text-decoration: none; font-size: 0.88rem; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.topbar-title { font-size: 0.95rem; font-weight: 600; color: var(--sage); }
.lang-toggle {
  background: var(--sage-pale); border: none; border-radius: 20px; padding: 4px 12px;
  font-size: 0.78rem; font-weight: 500; color: var(--sage); cursor: pointer; transition: background 0.2s;
}
.lang-toggle:hover { background: var(--sage-light); color: #fff; }

.tabs {
  display: flex; gap: 4px; padding: 16px 20px 0; max-width: 720px; margin: 0 auto;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab {
  padding: 10px 16px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  font-size: 0.82rem; font-weight: 500; background: var(--cream-dark);
  color: var(--warm-text-light); border: none; cursor: pointer; white-space: nowrap; transition: all 0.2s;
}
.tab.active { background: #fff; color: var(--sage); font-weight: 600; }

.panel {
  background: #fff; border-radius: 0 0 var(--radius) var(--radius);
  padding: 24px 20px; margin: 0 auto; max-width: 720px; min-height: 400px; box-shadow: var(--shadow);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 24px; border-radius: var(--radius-sm); font-size: 0.92rem;
  font-weight: 600; font-family: inherit; border: none; cursor: pointer; transition: all 0.2s;
}
.btn-primary { background: var(--sage); color: #fff; }
.btn-primary:hover { background: var(--sage-dark); }
.btn-secondary { background: #fff; color: var(--sage); border: 2px solid var(--sage-pale); }
.btn-secondary:hover { background: var(--sage-pale); }
.btn-small { padding: 8px 16px; font-size: 0.82rem; }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; }
.form-input, .form-select {
  width: 100%; padding: 12px 14px; border: 2px solid var(--cream-dark);
  border-radius: var(--radius-sm); font-size: 0.92rem; font-family: inherit;
  color: var(--warm-text); background: #fff; outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus { border-color: var(--sage-light); }

.section-title { font-size: 1.05rem; font-weight: 600; color: var(--sage-dark); margin-bottom: 6px; }
.section-sub { font-size: 0.82rem; color: var(--warm-text-light); margin-bottom: 16px; }

/* Activity blocks */
.activity-palette {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
}
.act-chip {
  display: flex; align-items: center; gap: 6px; padding: 8px 14px;
  border-radius: 20px; font-size: 0.82rem; cursor: pointer; transition: all 0.2s;
  border: 2px solid transparent;
}
.act-chip:hover { transform: scale(1.05); }

.schedule-block {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border-radius: var(--radius-sm); margin-bottom: 8px; cursor: grab; user-select: none;
}
.schedule-block:active { cursor: grabbing; }
.schedule-block.dragging { opacity: 0.5; }
.block-icon { font-size: 1.4rem; }
.block-label { flex: 1; font-size: 0.88rem; font-weight: 500; }
.block-time { font-size: 0.78rem; color: var(--warm-text-light); }
.block-remove { cursor: pointer; color: var(--red); font-size: 0.85rem; margin-left: 4px; }

/* Color categories */
.cat-morning { background: #FDF6E3; }
.cat-school { background: var(--blue-pale); }
.cat-activity { background: var(--green-bg); }
.cat-self { background: var(--coral-pale); }
.cat-evening { background: #E8E4F0; }

/* First-Then board */
.first-then {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0;
}
.ft-panel {
  border: 3px dashed var(--cream-dark); border-radius: var(--radius); padding: 24px 16px;
  text-align: center; min-height: 180px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; transition: all 0.2s;
}
.ft-panel.has-item { border-style: solid; border-color: var(--sage-light); background: var(--sage-pale); }
.ft-label { font-size: 1.1rem; font-weight: 700; color: var(--sage); margin-bottom: 8px; }
.ft-icon { font-size: 3rem; }
.ft-name { font-size: 1rem; font-weight: 600; }
.ft-select { margin-top: 12px; }

/* Social story */
.story-card {
  background: var(--cream); border-radius: var(--radius); padding: 24px;
  margin-bottom: 16px; line-height: 1.8; font-size: 1rem;
}
.story-sentence { margin-bottom: 12px; }

/* Transition Timer */
.timer-fullscreen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--cream); z-index: 200; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
}
.timer-circle-wrap { position: relative; width: 260px; height: 260px; }
.timer-circle-wrap svg { width: 100%; height: 100%; }
.timer-big-text {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 3rem; font-weight: 700; color: var(--sage-dark);
}
.timer-warning {
  font-size: 1.4rem; font-weight: 600; color: var(--coral);
  animation: pulse 1s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Template chips */
.template-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.template-chip {
  padding: 8px 16px; border-radius: 20px; font-size: 0.82rem; font-weight: 500;
  cursor: pointer; border: 2px solid var(--cream-dark); background: #fff; transition: all 0.2s;
}
.template-chip.active { background: var(--sage-pale); border-color: var(--sage); color: var(--sage-dark); }

@media print {
  .topbar, .tabs, .btn, .activity-palette, .template-row, .timer-fullscreen { display: none !important; }
  .panel { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
  .schedule-block { break-inside: avoid; border: 1px solid #ccc; }
  .ft-panel { border-style: solid; }
  .story-card { border: 1px solid #ccc; }
  body { background: #fff; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">&#8592; <span data-i18n="back">返回</span></a>
    <span class="topbar-title" data-i18n="title">视觉日程构建器</span>
  </div>
  <button class="lang-toggle" onclick="toggleLang()">EN / 中</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('schedule')" data-i18n="tab_schedule">每日日程</button>
  <button class="tab" onclick="showTab('firstthen')" data-i18n="tab_ft">先-然后</button>
  <button class="tab" onclick="showTab('story')" data-i18n="tab_story">社交故事</button>
  <button class="tab" onclick="showTab('timer')" data-i18n="tab_timer">过渡计时</button>
</div>

<!-- ==================== DAILY SCHEDULE ==================== -->
<div class="panel" id="panel-schedule">
  <div class="section-title" data-i18n="sched_title">每日日程</div>
  <p class="section-sub" data-i18n="sched_sub">点击活动添加到日程，拖放排序</p>

  <div class="template-row">
    <span class="template-chip active" onclick="loadTemplate('weekday')" data-i18n="tpl_weekday">工作日</span>
    <span class="template-chip" onclick="loadTemplate('weekend')" data-i18n="tpl_weekend">周末</span>
    <span class="template-chip" onclick="loadTemplate('holiday')" data-i18n="tpl_holiday">假期</span>
    <span class="template-chip" onclick="clearSchedule()" data-i18n="tpl_clear">清空</span>
  </div>

  <div class="activity-palette" id="act-palette"></div>

  <div id="schedule-list" style="min-height:100px;"></div>

  <div style="display:flex;gap:8px;margin-top:16px;">
    <button class="btn btn-primary" style="flex:1" onclick="window.print()" data-i18n="print">打印日程</button>
    <button class="btn btn-secondary" onclick="saveTemplate()" data-i18n="save_tpl">保存模板</button>
  </div>
</div>

<!-- ==================== FIRST-THEN ==================== -->
<div class="panel hidden" id="panel-firstthen">
  <div class="section-title" data-i18n="ft_title">先-然后板</div>
  <p class="section-sub" data-i18n="ft_sub">选择两个活动创建"先做...然后做..."视觉卡片</p>

  <div class="first-then">
    <div class="ft-panel" id="ft-first">
      <div class="ft-label" data-i18n="first">先</div>
      <div class="ft-icon" id="ft-first-icon">?</div>
      <div class="ft-name" id="ft-first-name"></div>
    </div>
    <div class="ft-panel" id="ft-then">
      <div class="ft-label" data-i18n="then">然后</div>
      <div class="ft-icon" id="ft-then-icon">?</div>
      <div class="ft-name" id="ft-then-name"></div>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" data-i18n="select_first">选择"先"活动</label>
    <select class="form-select" id="ft-first-select" onchange="updateFT()"></select>
  </div>
  <div class="form-group">
    <label class="form-label" data-i18n="select_then">选择"然后"活动</label>
    <select class="form-select" id="ft-then-select" onchange="updateFT()"></select>
  </div>

  <div style="display:flex;gap:8px;">
    <button class="btn btn-primary" style="flex:1" onclick="fullscreenFT()" data-i18n="fullscreen">全屏展示</button>
    <button class="btn btn-secondary" onclick="window.print()" data-i18n="print">打印</button>
  </div>

  <!-- Fullscreen FT overlay -->
  <div id="ft-fullscreen" class="hidden timer-fullscreen" onclick="closeFTFullscreen()" style="cursor:pointer;">
    <div style="display:flex;gap:40px;align-items:center;">
      <div style="text-align:center;">
        <div style="font-size:1.4rem;font-weight:700;color:var(--sage);margin-bottom:12px;" data-i18n="first">先</div>
        <div style="font-size:5rem;" id="ft-fs-first-icon"></div>
        <div style="font-size:1.2rem;font-weight:600;margin-top:8px;" id="ft-fs-first-name"></div>
      </div>
      <div style="font-size:2.5rem;color:var(--sage);">→</div>
      <div style="text-align:center;">
        <div style="font-size:1.4rem;font-weight:700;color:var(--sage);margin-bottom:12px;" data-i18n="then">然后</div>
        <div style="font-size:5rem;" id="ft-fs-then-icon"></div>
        <div style="font-size:1.2rem;font-weight:600;margin-top:8px;" id="ft-fs-then-name"></div>
      </div>
    </div>
    <div style="font-size:0.85rem;color:var(--warm-text-light);margin-top:30px;" data-i18n="tap_close">点击任意处关闭</div>
  </div>
</div>

<!-- ==================== SOCIAL STORY ==================== -->
<div class="panel hidden" id="panel-story">
  <div class="section-title" data-i18n="story_title">社交故事生成器</div>
  <p class="section-sub" data-i18n="story_sub">选择场景，自动生成社交故事</p>

  <div class="form-group">
    <label class="form-label" data-i18n="child_name">孩子的名字</label>
    <input class="form-input" id="story-name" placeholder="" oninput="renderStory()">
  </div>

  <div class="form-group">
    <label class="form-label" data-i18n="scenario">选择场景</label>
    <div style="display:flex;flex-wrap:wrap;gap:8px;" id="scenario-chips"></div>
  </div>

  <div id="story-output"></div>

  <button class="btn btn-primary" style="margin-top:16px;" onclick="window.print()" data-i18n="print_story">打印故事</button>
</div>

<!-- ==================== TRANSITION TIMER ==================== -->
<div class="panel hidden" id="panel-timer">
  <div class="section-title" data-i18n="timer_title">过渡计时器</div>
  <p class="section-sub" data-i18n="timer_sub">帮助孩子准备活动转换的视觉倒计时</p>

  <div class="form-group">
    <label class="form-label" data-i18n="set_minutes">设置分钟数 (1-30)</label>
    <input class="form-input" type="number" id="timer-minutes" min="1" max="30" value="5" style="max-width:120px;">
  </div>

  <div style="text-align:center;margin:20px 0;">
    <div style="position:relative;width:200px;height:200px;margin:0 auto;">
      <svg viewBox="0 0 200 200" style="width:100%;height:100%;">
        <circle cx="100" cy="100" r="90" fill="none" stroke="var(--cream-dark)" stroke-width="8"/>
        <circle id="timer-arc" cx="100" cy="100" r="90" fill="none" stroke="var(--sage)" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="565" stroke-dashoffset="0" transform="rotate(-90 100 100)"/>
      </svg>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;font-weight:700;color:var(--sage-dark);" id="timer-display">5:00</div>
    </div>
    <div id="timer-warning" class="hidden timer-warning" data-i18n="almost_done">快结束了！</div>
  </div>

  <div style="display:flex;gap:8px;justify-content:center;">
    <button class="btn btn-primary btn-small" id="timer-start-btn" onclick="startTimer()" data-i18n="start">开始</button>
    <button class="btn btn-secondary btn-small" onclick="resetTimer()" data-i18n="reset">重置</button>
    <button class="btn btn-secondary btn-small" onclick="fullscreenTimer()" data-i18n="fullscreen">全屏</button>
  </div>

  <!-- Fullscreen timer -->
  <div id="timer-fs" class="hidden timer-fullscreen">
    <div class="timer-circle-wrap">
      <svg viewBox="0 0 260 260" style="width:100%;height:100%;">
        <circle cx="130" cy="130" r="115" fill="none" stroke="var(--cream-dark)" stroke-width="10"/>
        <circle id="timer-fs-arc" cx="130" cy="130" r="115" fill="none" stroke="var(--sage)" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="723" stroke-dashoffset="0" transform="rotate(-90 130 130)"/>
      </svg>
      <div class="timer-big-text" id="timer-fs-display">5:00</div>
    </div>
    <div id="timer-fs-warning" class="hidden timer-warning" data-i18n="almost_done">快结束了！</div>
    <div style="display:flex;gap:12px;">
      <button class="btn btn-secondary" onclick="closeFullscreenTimer()" data-i18n="close">关闭</button>
      <button class="btn btn-primary" onclick="resetTimer();startTimer();" data-i18n="restart">重新开始</button>
    </div>
  </div>
</div>

<div style="height:40px;"></div>

<script>

//  I18N
// ===================================================================
let lang = 'zh';
const I18N = {
  zh: {
    back: '返回', title: '视觉日程构建器',
    tab_schedule: '每日日程', tab_ft: '先-然后', tab_story: '社交故事', tab_timer: '过渡计时',

function applyLang() {

    const k = el.getAttribute('data-i18n');
    if (I18N[lang][k]) el.textContent = I18N[lang][k];

}
function toggleLang() { lang = lang === 'zh' ? 'en' : 'zh'; renderAll(); }

//  DATA
// ===================================================================
const STORAGE_KEY = 'withyou_visual_schedule';
let data = { schedule: [], templates: {}, ftFirst: '', ftThen: '', storyName: '' };
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function load() { const s = localStorage.getItem(STORAGE_KEY); if (s) try { data = JSON.parse(s); } catch(e){} }

// 17 Activities

  { id: 'wake', icon: '☀️', zh: '起床', en: 'Wake Up', cat: 'morning' },

  { id: 'bedtime', icon: '🌙', zh: '睡觉', en: 'Bedtime', cat: 'evening' },
  { id: 'toilet', icon: '🚽', zh: '上厕所', en: 'Toilet', cat: 'self' },
  { id: 'outdoor', icon: '🌳', zh: '户外活动', en: 'Outdoor', cat: 'activity' },
  { id: 'screen', icon: '📺', zh: '屏幕时间', en: 'Screen Time', cat: 'activity' },
  { id: 'rest', icon: '😴', zh: '休息', en: 'Rest', cat: 'activity' },
  { id: 'transition', icon: '🔄', zh: '过渡', en: 'Transition', cat: 'activity' }
];

const CAT_COLORS = {
  morning: 'cat-morning', school: 'cat-school', activity: 'cat-activity',
  self: 'cat-self', evening: 'cat-evening'
};

const TEMPLATES = {
  weekday: ['wake','teeth','breakfast','dress','school','snack','therapy','play','dinner','bath','teeth','story','bedtime'],
  weekend: ['wake','breakfast','teeth','dress','outdoor','snack','play','screen','dinner','bath','story','bedtime'],
  holiday: ['wake','breakfast','teeth','play','snack','outdoor','rest','dinner','bath','story','bedtime']
};

// ===================================================================
//  TABS
// ===================================================================
const TABS = ['schedule','firstthen','story','timer'];
let activeTab = 'schedule';
function showTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', TABS[i] === tab));
  TABS.forEach(p => document.getElementById('panel-' + p).classList.toggle('hidden', p !== tab));
  renderAll();
}

// ===================================================================
//  DAILY SCHEDULE
// ===================================================================
function addToSchedule(id) {
  data.schedule.push(id);
  save();
  renderSchedule();
}

function removeFromSchedule(idx) {
  data.schedule.splice(idx, 1);
  save();
  renderSchedule();
}

function renderPalette() {
  document.getElementById('act-palette').innerHTML = ACTIVITIES.map(a =>
    `<span class="act-chip ${CAT_COLORS[a.cat]}" onclick="addToSchedule('${a.id}')">${a.icon} ${lang === 'zh' ? a.zh : a.en}</span>`
  ).join('');
}

function renderSchedule() {
  const list = document.getElementById('schedule-list');
  if (!data.schedule.length) {
    list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--warm-text-light);">${t('empty_sched')}</div>`;
    return;
  }
  list.innerHTML = data.schedule.map((id, i) => {
    const act = ACTIVITIES.find(a => a.id === id);
    if (!act) return '';
    return `<div class="schedule-block ${CAT_COLORS[act.cat]}" draggable="true" data-idx="${i}"
      ondragstart="sDragStart(event)" ondragover="sDragOver(event)" ondrop="sDrop(event)" ondragend="sDragEnd(event)">
      <span style="color:var(--warm-text-light);cursor:grab;">⠿</span>
      <span class="block-icon">${act.icon}</span>
      <span class="block-label">${lang === 'zh' ? act.zh : act.en}</span>
      <span class="block-remove" onclick="removeFromSchedule(${i})">×</span>
    </div>`;
  }).join('');
}

let sDragIdx = null;
function sDragStart(e) { sDragIdx = parseInt(e.target.dataset.idx); e.target.classList.add('dragging'); }
function sDragOver(e) { e.preventDefault(); }
function sDrop(e) {
  e.preventDefault();
  const t = e.target.closest('.schedule-block');
  if (!t) return;
  const to = parseInt(t.dataset.idx);
  if (sDragIdx === null || sDragIdx === to) return;
  const item = data.schedule.splice(sDragIdx, 1)[0];
  data.schedule.splice(to, 0, item);
  save(); renderSchedule();
}
function sDragEnd(e) { e.target.classList.remove('dragging'); sDragIdx = null; }

function loadTemplate(name) {
  const saved = data.templates[name];
  data.schedule = saved ? [...saved] : [...TEMPLATES[name]];
  save();
  document.querySelectorAll('.template-chip').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  renderSchedule();
}

function clearSchedule() { data.schedule = []; save(); renderSchedule(); }

function saveTemplate() {
  const name = prompt(lang === 'zh' ? '模板名称（weekday/weekend/holiday）：' : 'Template name (weekday/weekend/holiday):');
  if (!name) return;
  data.templates[name] = [...data.schedule];
  save();
  alert(t('saved'));
}

// ===================================================================
//  FIRST-THEN BOARD
// ===================================================================
function renderFT() {
  const sel1 = document.getElementById('ft-first-select');
  const sel2 = document.getElementById('ft-then-select');
  const opts = '<option value="">--</option>' + ACTIVITIES.map(a =>
    `<option value="${a.id}">${a.icon} ${lang === 'zh' ? a.zh : a.en}</option>`
  ).join('');
  sel1.innerHTML = opts;
  sel2.innerHTML = opts;
  if (data.ftFirst) sel1.value = data.ftFirst;
  if (data.ftThen) sel2.value = data.ftThen;
  updateFT();
}

function updateFT() {
  const f = document.getElementById('ft-first-select').value;
  const th = document.getElementById('ft-then-select').value;
  data.ftFirst = f;
  data.ftThen = th;
  save();

  const fa = ACTIVITIES.find(a => a.id === f);
  const ta = ACTIVITIES.find(a => a.id === th);

  const fp = document.getElementById('ft-first');
  const tp = document.getElementById('ft-then');

  if (fa) {
    fp.classList.add('has-item');
    document.getElementById('ft-first-icon').textContent = fa.icon;
    document.getElementById('ft-first-name').textContent = lang === 'zh' ? fa.zh : fa.en;
  } else {
    fp.classList.remove('has-item');
    document.getElementById('ft-first-icon').textContent = '?';
    document.getElementById('ft-first-name').textContent = '';
  }

  if (ta) {
    tp.classList.add('has-item');
    document.getElementById('ft-then-icon').textContent = ta.icon;
    document.getElementById('ft-then-name').textContent = lang === 'zh' ? ta.zh : ta.en;
  } else {
    tp.classList.remove('has-item');
    document.getElementById('ft-then-icon').textContent = '?';
    document.getElementById('ft-then-name').textContent = '';
  }
}

function fullscreenFT() {
  const fa = ACTIVITIES.find(a => a.id === data.ftFirst);
  const ta = ACTIVITIES.find(a => a.id === data.ftThen);
  if (!fa || !ta) return;
  document.getElementById('ft-fs-first-icon').textContent = fa.icon;
  document.getElementById('ft-fs-first-name').textContent = lang === 'zh' ? fa.zh : fa.en;
  document.getElementById('ft-fs-then-icon').textContent = ta.icon;
  document.getElementById('ft-fs-then-name').textContent = lang === 'zh' ? ta.zh : ta.en;
  document.getElementById('ft-fullscreen').classList.remove('hidden');
}

function closeFTFullscreen() { document.getElementById('ft-fullscreen').classList.add('hidden'); }

// ===================================================================
//  TRANSITION TIMER
// ===================================================================
let timerInterval = null;
let timerSecsLeft = 0;
let timerTotal = 0;
let timerRunning = false;

function startTimer() {
  if (timerRunning) { pauseTimer(); return; }
  if (timerSecsLeft <= 0) {
    const mins = parseInt(document.getElementById('timer-minutes').value) || 5;
    timerTotal = mins * 60;
    timerSecsLeft = timerTotal;
  }
  timerRunning = true;
  document.getElementById('timer-start-btn').textContent = lang === 'zh' ? '暂停' : 'Pause';
  timerInterval = setInterval(() => {
    timerSecsLeft--;
    updateTimerUI();
    if (timerSecsLeft <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timer-start-btn').textContent = t('start');
      // Chime
      try {
        const ac = new AudioContext();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.frequency.value = 523; osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1);
        osc.start(); osc.stop(ac.currentTime + 1);
      } catch(e){}
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('timer-start-btn').textContent = t('start');
}

function resetTimer() {
  pauseTimer();
  const mins = parseInt(document.getElementById('timer-minutes').value) || 5;
  timerTotal = mins * 60;
  timerSecsLeft = timerTotal;
  updateTimerUI();
}

function updateTimerUI() {
  const m = Math.floor(timerSecsLeft / 60);
  const s = timerSecsLeft % 60;
  const str = `${m}:${String(s).padStart(2, '0')}`;
  document.getElementById('timer-display').textContent = str;
  document.getElementById('timer-fs-display').textContent = str;

  const pct = timerTotal > 0 ? timerSecsLeft / timerTotal : 1;
  document.getElementById('timer-arc').setAttribute('stroke-dashoffset', (1 - pct) * 565);
  document.getElementById('timer-fs-arc').setAttribute('stroke-dashoffset', (1 - pct) * 723);

  // 5-minute warning
  const warn = timerSecsLeft > 0 && timerSecsLeft <= 300 && timerSecsLeft % 60 === 0;
  const showWarn = timerSecsLeft <= 60 && timerSecsLeft > 0;
  document.getElementById('timer-warning').classList.toggle('hidden', !showWarn);
  document.getElementById('timer-fs-warning').classList.toggle('hidden', !showWarn);

  if (timerSecsLeft <= 0) {
    document.getElementById('timer-display').textContent = t('done');
    document.getElementById('timer-fs-display').textContent = t('done');
  }
}

function fullscreenTimer() { document.getElementById('timer-fs').classList.remove('hidden'); }
function closeFullscreenTimer() { document.getElementById('timer-fs').classList.add('hidden'); }
