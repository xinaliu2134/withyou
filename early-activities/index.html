<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早期干预活动 — 同路 WithYou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sage: #6B8F7B;
  --sage-light: #8FB09D;
  --sage-pale: #E8F0EB;
  --sage-dark: #4A6B56;
  --cream: #FAF7F0;
  --cream-dark: #F0EBDF;
  --blue: #7BA7BC;
  --blue-light: #A5C7D6;
  --blue-pale: #E4EFF4;
  --warm-text: #3D3D3D;
  --warm-text-light: #6B6B6B;
  --coral: #D4917B;
  --coral-pale: #F5E0D8;
  --yellow: #C9A84C;
  --yellow-bg: #FDF6E3;
  --green-bg: #E8F0EB;
  --shadow: 0 2px 16px rgba(107,143,123,0.10);
  --shadow-lg: 0 6px 28px rgba(107,143,123,0.14);
  --radius: 16px;
  --radius-sm: 10px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--warm-text);
  line-height: 1.6;
  min-height: 100vh;
}

.hidden { display: none !important; }
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; }

/* ===== Top Bar ===== */
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--cream-dark);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-back {
  color: var(--sage);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}
.topbar-title { font-size: 0.95rem; font-weight: 600; color: var(--sage); }
.topbar-right { display: flex; gap: 8px; }
.lang-toggle {
  background: var(--sage-pale);
  border: none;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--sage);
  cursor: pointer;
  transition: all 0.2s;
}
.lang-toggle:hover { background: var(--sage-light); color: #fff; }
.lang-toggle.active { background: var(--sage); color: #fff; }

/* ===== Hero ===== */
.hero {
  text-align: center;
  padding: 32px 20px 16px;
}
.hero-icon { font-size: 2.8rem; margin-bottom: 10px; }
.hero h1 { font-size: 1.5rem; font-weight: 700; color: var(--sage-dark); margin-bottom: 4px; }
.hero p { font-size: 0.92rem; color: var(--warm-text-light); max-width: 520px; margin: 0 auto; }

/* ===== Daily Suggestion ===== */
.daily-card {
  background: linear-gradient(135deg, var(--sage) 0%, var(--sage-light) 100%);
  color: #fff;
  border-radius: var(--radius);
  padding: 20px;
  margin: 0 20px 16px;
  max-width: 680px;
  margin-left: auto;
  margin-right: auto;
}
.daily-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  opacity: 0.85;
  margin-bottom: 8px;
}
.daily-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
.daily-desc { font-size: 0.84rem; opacity: 0.9; line-height: 1.5; }
.daily-meta { display: flex; gap: 12px; margin-top: 10px; font-size: 0.78rem; opacity: 0.8; }
.daily-btn {
  margin-top: 12px;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
}
.daily-btn:hover { background: rgba(255,255,255,0.3); }

/* ===== Skill Tabs ===== */
.skill-tabs {
  display: flex;
  gap: 6px;
  padding: 8px 20px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.skill-tabs::-webkit-scrollbar { display: none; }
.skill-tab {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 24px;
  border: 1.5px solid var(--cream-dark);
  background: #fff;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--warm-text-light);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.skill-tab:hover { border-color: var(--sage-light); color: var(--sage); }
.skill-tab.active { background: var(--sage); color: #fff; border-color: var(--sage); }

/* ===== Progress Bar ===== */
.progress-strip {
  display: flex;
  gap: 8px;
  padding: 12px 20px;
  max-width: 720px;
  margin: 0 auto;
}
.progress-item {
  flex: 1;
  text-align: center;
}
.progress-bar-bg {
  height: 6px;
  background: var(--cream-dark);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 4px;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.4s ease;
}
.progress-label { font-size: 0.7rem; color: var(--warm-text-light); }

/* ===== Activity Cards ===== */
.activity-list { padding: 8px 0 80px; }

.activity-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 0;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow 0.2s;
}
.activity-card:hover { box-shadow: var(--shadow-lg); }

.activity-header {
  padding: 16px 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
}
.activity-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.activity-info { flex: 1; }
.activity-title { font-size: 0.95rem; font-weight: 600; color: var(--warm-text); }
.activity-subtitle { font-size: 0.8rem; color: var(--warm-text-light); margin-top: 2px; }
.activity-meta {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}
.meta-tag {
  font-size: 0.72rem;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--cream-dark);
  color: var(--warm-text-light);
}

.activity-expand { font-size: 1.2rem; color: var(--warm-text-light); transition: transform 0.3s; }
.activity-card.open .activity-expand { transform: rotate(180deg); }

.activity-body {
  display: none;
  padding: 0 20px 16px;
  border-top: 1px solid var(--cream-dark);
}
.activity-card.open .activity-body { display: block; }

.steps-list {
  list-style: none;
  margin: 14px 0;
}
.steps-list li {
  display: flex;
  gap: 10px;
  padding: 8px 0;
  font-size: 0.86rem;
  align-items: flex-start;
}
.step-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--sage-pale);
  color: var(--sage);
  font-size: 0.72rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}

.tips-box {
  background: var(--yellow-bg);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-top: 10px;
}
.tips-box h4 {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--yellow);
  margin-bottom: 4px;
}
.tips-box p {
  font-size: 0.82rem;
  color: var(--warm-text-light);
  line-height: 1.5;
}

/* ===== Status Buttons ===== */
.status-btns {
  display: flex;
  gap: 6px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.status-btn {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 500;
  border: 1.5px solid var(--cream-dark);
  background: #fff;
  cursor: pointer;
  transition: all 0.2s;
}
.status-btn[data-status="tried"] { }
.status-btn[data-status="working"] { }
.status-btn[data-status="not-working"] { }
.status-btn.active[data-status="tried"] { background: var(--blue-pale); border-color: var(--blue); color: var(--blue); }
.status-btn.active[data-status="working"] { background: var(--green-bg); border-color: var(--sage); color: var(--sage); }
.status-btn.active[data-status="not-working"] { background: var(--coral-pale); border-color: var(--coral); color: var(--coral); }

/* Notes */
.note-input {
  width: 100%;
  margin-top: 10px;
  padding: 8px 12px;
  border: 1.5px solid var(--cream-dark);
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-family: inherit;
  color: var(--warm-text);
  resize: none;
  min-height: 50px;
}
.note-input:focus { outline: none; border-color: var(--sage-light); }

/* ===== Timer ===== */
.timer-section {
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.timer-display {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--sage-dark);
  font-variant-numeric: tabular-nums;
  min-width: 60px;
}
.timer-btn {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
}
.timer-start { background: var(--sage); color: #fff; }
.timer-start:hover { background: var(--sage-dark); }
.timer-reset { background: var(--cream-dark); color: var(--warm-text-light); }
.timer-reset:hover { background: #e0dbd0; }

/* ===== Disclaimer ===== */
.disclaimer {
  background: var(--blue-pale);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin: 0 0 20px;
  font-size: 0.82rem;
  color: var(--warm-text-light);
  line-height: 1.6;
}
.disclaimer strong { color: var(--blue); }

/* ===== References ===== */
.references {
  font-size: 0.78rem;
  color: var(--warm-text-light);
  padding: 0 0 30px;
  line-height: 1.6;
}
.references strong { color: var(--warm-text); }

@media (max-width: 480px) {
  .hero h1 { font-size: 1.3rem; }
  .daily-card { margin: 0 16px 16px; }
  .progress-strip { padding: 12px 16px; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">&#8592; <span data-zh="返回" data-en="Back">返回</span></a>
    <span class="topbar-title" data-zh="早期干预活动" data-en="Early Activities">早期干预活动</span>
  </div>
  <div class="topbar-right">

    <button class="lang-toggle" onclick="setLang('en')">EN</button>
  </div>
</div>

<!-- Hero -->
<div class="hero">
  <div class="hero-icon">&#127912;</div>
  <h1 data-zh="早期干预活动" data-en="Early Intervention Activities">早期干预活动</h1>
  <p data-zh="基于循证研究的居家亲子活动，每天5-10分钟，在游戏中促进孩子发展" data-en="Evidence-based home activities, 5-10 minutes daily, promoting development through play">基于循证研究的居家亲子活动，每天5-10分钟，在游戏中促进孩子发展</p>
</div>

<!-- Daily Suggestion -->
<div class="daily-card" id="dailyCard"></div>

<!-- Skill Tabs -->
<div class="skill-tabs" id="skillTabs">

  <button class="skill-tab" data-skill="imitation">&#129528; <span data-zh="模仿" data-en="Imitation">模仿</span></button>
  <button class="skill-tab" data-skill="communication">&#128172; <span data-zh="沟通" data-en="Communication">沟通</span></button>
  <button class="skill-tab" data-skill="play">&#127922; <span data-zh="游戏技能" data-en="Play Skills">游戏技能</span></button>
</div>

<!-- Progress -->
<div class="progress-strip" id="progressStrip"></div>

<!-- Activities -->
<div class="container">
  <div class="activity-list" id="activityList"></div>

  <div class="disclaimer" id="disclaimer"></div>
  <div class="references" id="references"></div>
</div>

<script>
// ===== Activity Data =====
const ACTIVITIES = {

      },
      {

// ===== State =====
let currentLang = localStorage.getItem('withyou-lang') || 'zh';
let currentSkill = 'joint';
let activityState = JSON.parse(localStorage.getItem('withyou-activities') || '{}');
let timers = {};

// ===== Language =====
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('withyou-lang', lang);
  document.querySelectorAll('.lang-toggle').forEach(b => b.classList.toggle('active', b.textContent.trim() === (lang === 'zh' ? '中文' : 'EN')));
  document.querySelectorAll('[data-zh]').forEach(el => el.textContent = el.getAttribute('data-' + lang));
  renderDaily();
  renderProgress();
  renderActivities();
  renderFooter();
}

// ===== Skill Tabs =====
document.getElementById('skillTabs').addEventListener('click', e => {
  const tab = e.target.closest('.skill-tab');
  if (!tab) return;
  document.querySelectorAll('.skill-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentSkill = tab.dataset.skill;
  renderActivities();
});

// ===== Daily Suggestion =====
function renderDaily() {
  const allItems = Object.values(ACTIVITIES).flatMap(s => s.items);
  const dayIndex = Math.floor(Date.now() / 86400000) % allItems.length;
  const item = allItems[dayIndex];
  const lang = currentLang;
  const d = item[lang];
  const card = document.getElementById('dailyCard');
  card.innerHTML = `
    <div class="daily-label">${lang === 'zh' ? '今日推荐活动' : "TODAY'S SUGGESTED ACTIVITY"}</div>
    <div class="daily-title">${d.title}</div>
    <div class="daily-desc">${d.subtitle}</div>
    <div class="daily-meta"><span>${d.age}</span><span>${d.duration}</span></div>
    <button class="daily-btn" onclick="openDailyActivity('${item.id}')">${lang === 'zh' ? '查看详情' : 'View Details'} &#8594;</button>
  `;
}

function openDailyActivity(id) {
  for (const [skill, data] of Object.entries(ACTIVITIES)) {
    if (data.items.find(i => i.id === id)) {
      currentSkill = skill;
      document.querySelectorAll('.skill-tab').forEach(t => t.classList.toggle('active', t.dataset.skill === skill));
      renderActivities();
      setTimeout(() => {
        const el = document.querySelector(`[data-id="${id}"]`);
        if (el) { el.classList.add('open'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      }, 100);
      return;
    }
  }
}

// ===== Progress =====
function renderProgress() {
  const strip = document.getElementById('progressStrip');
  const lang = currentLang;
  const colors = { joint: '#7BA7BC', imitation: '#D4917B', communication: '#6B8F7B', play: '#C9A84C' };
  const names = {
    joint: { zh: '共同注意', en: 'Joint Attn' },
    imitation: { zh: '模仿', en: 'Imitation' },
    communication: { zh: '沟通', en: 'Comm.' },
    play: { zh: '游戏', en: 'Play' }
  };

  strip.innerHTML = Object.entries(ACTIVITIES).map(([key, data]) => {
    const total = data.items.length;
    const tried = data.items.filter(i => activityState[i.id]?.status).length;
    const pct = total ? Math.round(tried / total * 100) : 0;
    return `<div class="progress-item">
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:${colors[key]}"></div></div>
      <div class="progress-label">${names[key][lang]} ${pct}%</div>
    </div>`;
  }).join('');
}

// ===== Activities =====
function renderActivities() {
  const data = ACTIVITIES[currentSkill];
  const lang = currentLang;
  const list = document.getElementById('activityList');

  list.innerHTML = data.items.map(item => {
    const d = item[lang];
    const state = activityState[item.id] || {};
    return `<div class="activity-card" data-id="${item.id}">
      <div class="activity-header" onclick="toggleCard(this)">
        <div class="activity-icon" style="background:${data.bg}">${item.icon}</div>
        <div class="activity-info">
          <div class="activity-title">${d.title}</div>
          <div class="activity-subtitle">${d.subtitle}</div>
          <div class="activity-meta">
            <span class="meta-tag">${d.age}</span>
            <span class="meta-tag">${d.duration}</span>
            ${state.status ? `<span class="meta-tag" style="background:${state.status === 'working' ? 'var(--green-bg)' : state.status === 'not-working' ? 'var(--coral-pale)' : 'var(--blue-pale)'}">${
              state.status === 'tried' ? (lang === 'zh' ? '已试' : 'Tried') :
              state.status === 'working' ? (lang === 'zh' ? '有效' : 'Working') :
              (lang === 'zh' ? '待调整' : 'Adjust')
            }</span>` : ''}
          </div>
        </div>
        <div class="activity-expand">&#9660;</div>
      </div>
      <div class="activity-body">
        <ol class="steps-list">${d.steps.map((s, i) => `<li><span class="step-num">${i + 1}</span><span>${s}</span></li>`).join('')}</ol>
        <div class="tips-box"><h4>${lang === 'zh' ? '小贴士' : 'Tips'}</h4><p>${d.tips}</p></div>
        <div class="status-btns">
          <button class="status-btn ${state.status === 'tried' ? 'active' : ''}" data-status="tried" onclick="setStatus('${item.id}','tried')">${lang === 'zh' ? '已尝试' : 'Tried'}</button>
          <button class="status-btn ${state.status === 'working' ? 'active' : ''}" data-status="working" onclick="setStatus('${item.id}','working')">${lang === 'zh' ? '有效' : 'Working'}</button>
          <button class="status-btn ${state.status === 'not-working' ? 'active' : ''}" data-status="not-working" onclick="setStatus('${item.id}','not-working')">${lang === 'zh' ? '需调整' : 'Not Working'}</button>
        </div>
        <div class="timer-section">
          <div class="timer-display" id="timer-${item.id}">0:00</div>
          <button class="timer-btn timer-start" onclick="toggleTimer('${item.id}')" id="timer-btn-${item.id}">${lang === 'zh' ? '开始计时' : 'Start'}</button>
          <button class="timer-btn timer-reset" onclick="resetTimer('${item.id}')">${lang === 'zh' ? '重置' : 'Reset'}</button>
        </div>
        <textarea class="note-input" placeholder="${lang === 'zh' ? '添加笔记...' : 'Add notes...'}" data-id="${item.id}" onblur="saveNote(this)">${state.note || ''}</textarea>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(header) {
  header.closest('.activity-card').classList.toggle('open');
}

function setStatus(id, status) {
  if (!activityState[id]) activityState[id] = {};
  activityState[id].status = activityState[id].status === status ? null : status;
  localStorage.setItem('withyou-activities', JSON.stringify(activityState));
  renderActivities();
  renderProgress();
}

function saveNote(el) {
  const id = el.dataset.id;
  if (!activityState[id]) activityState[id] = {};
  activityState[id].note = el.value;
  localStorage.setItem('withyou-activities', JSON.stringify(activityState));
}

// ===== Timer =====
function toggleTimer(id) {
  const display = document.getElementById('timer-' + id);
  const btn = document.getElementById('timer-btn-' + id);
  if (timers[id]) {
    clearInterval(timers[id].interval);
    delete timers[id];
    btn.textContent = currentLang === 'zh' ? '开始计时' : 'Start';
  } else {
    let seconds = 0;
    timers[id] = {
      interval: setInterval(() => {
        seconds++;
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        display.textContent = m + ':' + (s < 10 ? '0' : '') + s;
      }, 1000)
    };
    btn.textContent = currentLang === 'zh' ? '暂停' : 'Pause';
  }
}

function resetTimer(id) {
  if (timers[id]) { clearInterval(timers[id].interval); delete timers[id]; }
  const display = document.getElementById('timer-' + id);
  const btn = document.getElementById('timer-btn-' + id);
  if (display) display.textContent = '0:00';
  if (btn) btn.textContent = currentLang === 'zh' ? '开始计时' : 'Start';
}

// ===== Footer =====
function renderFooter() {
  const lang = currentLang;
  document.getElementById('disclaimer').innerHTML = lang === 'zh'
    ? '<strong>&#9888; 重要提示：</strong>这些活动旨在补充而非替代专业干预。它们基于循证研究的自然发展行为干预（NDBI）原则。如果您对孩子的发育有任何担忧，请咨询专业人士。每个孩子都是独特的，活动效果因人而异。'
    : '<strong>&#9888; Important:</strong> These activities are meant to supplement, not replace, professional intervention. They are based on evidence-based Naturalistic Developmental Behavioral Intervention (NDBI) principles. If you have concerns about your child\'s development, please consult a professional. Every child is unique; results may vary.';

  document.getElementById('references').innerHTML = lang === 'zh'
    ? '<strong>参考文献：</strong><br>Schreibman, L., et al. (2015). Naturalistic Developmental Behavioral Interventions: Empirically Validated Treatments for Autism Spectrum Disorder. <em>Journal of Autism and Developmental Disorders, 45</em>(8), 2411-2428.<br>Dawson, G., et al. (2010). Randomized, Controlled Trial of an Intervention for Toddlers With Autism: The Early Start Denver Model. <em>Pediatrics, 125</em>(1), e17-e23.'
    : '<strong>References:</strong><br>Schreibman, L., et al. (2015). Naturalistic Developmental Behavioral Interventions: Empirically Validated Treatments for Autism Spectrum Disorder. <em>Journal of Autism and Developmental Disorders, 45</em>(8), 2411-2428.<br>Dawson, G., et al. (2010). Randomized, Controlled Trial of an Intervention for Toddlers With Autism: The Early Start Denver Model. <em>Pediatrics, 125</em>(1), e17-e23.';
}

// ===== Init =====
setLang(currentLang);
</script>
