<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>早期干预活动 — 同路 WithYou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sage: #6B8F7B;
  --sage-light: #8FB09D;
  --sage-pale: #E8F0EB;
  --sage-dark: #4A6B56;
  --cream: #FAF7F0;
  --cream-dark: #F0EBDF;
  --blue: #7BA7BC;
  --blue-light: #A5C7D6;
  --blue-pale: #E4EFF4;
  --warm-text: #3D3D3D;
  --warm-text-light: #6B6B6B;
  --coral: #D4917B;
  --coral-pale: #F5E0D8;
  --yellow: #C9A84C;
  --yellow-bg: #FDF6E3;
  --shadow: 0 2px 16px rgba(107,143,123,0.10);
  --shadow-hover: 0 6px 28px rgba(107,143,123,0.18);
  --radius: 20px;
  --radius-sm: 12px;
}

:root.dark {
  --cream: #1a1f1c;
  --cream-dark: #252b27;
  --sage-pale: #2a3a30;
  --blue-pale: #243038;
  --warm-text: #e0ddd6;
  --warm-text-light: #9a9a8e;
  --shadow: 0 2px 16px rgba(0,0,0,0.25);
}

.dark .card, .dark .result-card, .dark .browse-card { background: #222822 !important; }
.dark .topbar { background: #1a1f1c; border-color: #2a3a30; }
.dark .chip { background: #2a3a30 !important; color: var(--warm-text) !important; }
.dark .chip.active { background: var(--sage) !important; color: #fff !important; }
.dark input[type="text"], .dark select, .dark #browseSearch { background: #2a3a30; color: var(--warm-text); border-color: #3a4a40; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--warm-text);
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom, 20px);
  transition: background 0.3s, color 0.3s;
}

.hidden { display: none !important; }
.container { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* ===== Top Bar ===== */
.topbar {
  background: rgba(250,247,240,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--cream-dark);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 8px; }
.topbar-back {
  color: var(--sage);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 2px;
}
.topbar-title { font-size: 0.95rem; font-weight: 600; color: var(--sage-dark); }
.topbar-actions { display: flex; gap: 6px; }
.topbar-btn {
  background: var(--sage-pale);
  border: none;
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--sage);
  cursor: pointer;
  transition: all 0.2s;
}
.topbar-btn:hover { background: var(--sage-light); color: #fff; }
.topbar-btn.active { background: var(--sage); color: #fff; }

/* ===== View Tabs ===== */
.view-tabs {
  display: flex;
  gap: 0;
  margin: 16px 0 12px;
  background: var(--cream-dark);
  border-radius: var(--radius-sm);
  padding: 3px;
}
.view-tab {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: transparent;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--warm-text-light);
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.view-tab.active { background: #fff; color: var(--sage-dark); box-shadow: var(--shadow); }
.dark .view-tab.active { background: #2a3a30; }

/* ===== Cards ===== */
.card {
  background: #fff;
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--warm-text-light);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 14px;
}

/* ===== Recommender Form ===== */
.form-label {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--warm-text);
  margin-bottom: 8px;
  margin-top: 16px;
}
.form-label:first-child { margin-top: 0; }
.form-sublabel {
  font-size: 0.75rem;
  color: var(--warm-text-light);
  margin-bottom: 8px;
}

/* Chips */
.chip-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.chip {
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  background: var(--sage-pale);
  color: var(--sage-dark);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.chip:hover { background: var(--sage-light); color: #fff; }
.chip.active { background: var(--sage); color: #fff; }
.chip-emoji { font-size: 1.1rem; margin-right: 2px; }

.mood-chip {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  font-size: 1.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.material-chips .chip { font-size: 0.78rem; padding: 6px 12px; }
.material-chips .chip.active { background: var(--blue); }

.recommend-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--sage);
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 20px;
  transition: background 0.2s, transform 0.1s;
}
.recommend-btn:hover { background: var(--sage-dark); }
.recommend-btn:active { transform: scale(0.98); }

/* ===== Result Card ===== */
.result-card {
  background: #fff;
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.result-header {
  background: linear-gradient(135deg, var(--sage) 0%, var(--sage-light) 100%);
  color: #fff;
  padding: 22px 20px 18px;
}
.result-why {
  font-size: 0.78rem;
  opacity: 0.85;
  margin-bottom: 6px;
  line-height: 1.5;
}
.result-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.result-tag {
  background: rgba(255,255,255,0.2);
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.72rem;
  font-weight: 500;
}
.result-name {
  font-size: 1.4rem;
  font-weight: 700;
  line-height: 1.3;
}
.result-name-en {
  font-size: 0.95rem;
  font-weight: 400;
  opacity: 0.85;
}
.result-body { padding: 20px; }
.result-steps {
  list-style: none;
  margin-bottom: 16px;
}
.result-steps li {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--cream-dark);
  align-items: flex-start;
}
.result-steps li:last-child { border-bottom: none; }
.step-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--sage-pale);
  color: var(--sage);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.78rem;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}
.step-text {
  font-size: 0.95rem;
  line-height: 1.5;
}
.step-text-en {
  font-size: 0.82rem;
  color: var(--warm-text-light);
}
.result-tip {
  background: var(--yellow-bg);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 0.82rem;
  margin-bottom: 16px;
  line-height: 1.5;
}
.dark .result-tip { background: #2a2a1a; }
.result-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.result-btn {
  flex: 1;
  min-width: 100px;
  padding: 12px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.result-btn.primary { background: var(--sage); color: #fff; }
.result-btn.primary:hover { background: var(--sage-dark); }
.result-btn.secondary { background: var(--sage-pale); color: var(--sage); }
.result-btn.secondary:hover { background: var(--sage-light); color: #fff; }

/* ===== Completion Celebration ===== */
.celebration {
  text-align: center;
  padding: 24px;
}
.celebration-emoji { font-size: 3rem; margin-bottom: 12px; }
.celebration-text {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--sage-dark);
  margin-bottom: 4px;
}
.celebration-sub {
  font-size: 0.85rem;
  color: var(--warm-text-light);
  margin-bottom: 16px;
}
.feedback-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 12px;
}
.fb-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 2px solid var(--cream-dark);
  background: #fff;
  font-size: 1.6rem;
  cursor: pointer;
  transition: all 0.2s;
}
.dark .fb-btn { background: #2a3a30; border-color: #3a4a40; }
.fb-btn:hover { transform: scale(1.1); }
.fb-btn.chosen { border-color: var(--sage); background: var(--sage-pale); transform: scale(1.15); }
.fb-note {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--cream-dark);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-family: inherit;
  outline: none;
  margin-bottom: 12px;
}
.fb-note:focus { border-color: var(--sage-light); }

/* ===== Browse Mode ===== */
.filter-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.filter-select {
  padding: 7px 12px;
  border: 1px solid var(--cream-dark);
  border-radius: 20px;
  font-size: 0.78rem;
  font-family: inherit;
  background: #fff;
  color: var(--warm-text);
  outline: none;
  cursor: pointer;
}
.dark .filter-select { background: #2a3a30; border-color: #3a4a40; }

.browse-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 14px;
}
.browse-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.browse-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.browse-icon.ja { background: var(--sage-pale); }
.browse-icon.im { background: var(--blue-pale); }
.browse-icon.co { background: var(--coral-pale); }
.browse-icon.tt { background: var(--yellow-bg); }
.browse-icon.re { background: #EDE7F6; }
.browse-icon.se { background: #E0F2F1; }
.browse-icon.pl { background: #FFF3E0; }
.browse-info { flex: 1; min-width: 0; }
.browse-name {
  font-size: 0.92rem;
  font-weight: 600;
  line-height: 1.3;
}
.browse-name-en {
  font-size: 0.75rem;
  color: var(--warm-text-light);
}
.browse-meta {
  font-size: 0.72rem;
  color: var(--warm-text-light);
  margin-top: 2px;
}
.browse-stats {
  text-align: right;
  flex-shrink: 0;
}
.browse-tried {
  font-size: 0.7rem;
  color: var(--warm-text-light);
}
.browse-star {
  font-size: 1.1rem;
  cursor: pointer;
  background: none;
  border: none;
  padding: 2px;
}

/* ===== History ===== */
.history-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--cream-dark);
}
.history-item:last-child { border-bottom: none; }
.history-date {
  font-size: 0.75rem;
  color: var(--warm-text-light);
  min-width: 50px;
}
.history-name {
  flex: 1;
  font-size: 0.88rem;
  font-weight: 500;
}
.history-rating { font-size: 1rem; }
.history-empty {
  text-align: center;
  padding: 24px;
  color: var(--warm-text-light);
  font-size: 0.88rem;
}

/* ===== Stats Row ===== */
.stats-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.stat-box {
  flex: 1;
  background: var(--sage-pale);
  border-radius: var(--radius-sm);
  padding: 14px;
  text-align: center;
}
.stat-num {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--sage-dark);
}
.stat-label {
  font-size: 0.7rem;
  color: var(--warm-text-light);
  margin-top: 2px;
}

/* ===== Footer ===== */
.footer {
  text-align: center;
  padding: 32px 16px 40px;
  font-size: 0.75rem;
  color: var(--warm-text-light);
  line-height: 1.7;
}

@media (max-width: 380px) {
  .mood-chip { width: 46px; height: 46px; font-size: 1.4rem; }
  .result-name { font-size: 1.2rem; }
}
</style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<nav class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">← 同路</a>
    <span class="topbar-title">早期干预活动</span>
  </div>
  <div class="topbar-actions">
    <button class="topbar-btn" onclick="toggleDark()" id="darkBtn">🌙</button>
  </div>
</nav>

<div class="container">

  <!-- ===== View Tabs ===== -->
  <div class="view-tabs">
    <button class="view-tab active" onclick="switchView('recommend')" id="tabRecommend">智能推荐 Recommend</button>
    <button class="view-tab" onclick="switchView('browse')" id="tabBrowse">浏览全部 Browse</button>
    <button class="view-tab" onclick="switchView('history')" id="tabHistory">历史 History</button>
  </div>

  <!-- ===== RECOMMEND VIEW ===== -->
  <div id="viewRecommend">

    <!-- Form -->
    <div class="card" id="recommenderForm">
      <div class="form-label">孩子现在的状态 Child's mood right now</div>
      <div class="chip-row">
        <button class="chip mood-chip" data-mood="happy" onclick="pickChip(this,'mood')">😊</button>
        <button class="chip mood-chip" data-mood="neutral" onclick="pickChip(this,'mood')">😐</button>
        <button class="chip mood-chip" data-mood="upset" onclick="pickChip(this,'mood')">😢</button>
        <button class="chip mood-chip" data-mood="overwhelmed" onclick="pickChip(this,'mood')">🤯</button>
        <button class="chip mood-chip" data-mood="tired" onclick="pickChip(this,'mood')">😴</button>
      </div>

      <div class="form-label">你有多少时间 Available time</div>
      <div class="chip-row">
        <button class="chip" data-time="5" onclick="pickChip(this,'time')">5 min</button>
        <button class="chip" data-time="10" onclick="pickChip(this,'time')">10 min</button>
        <button class="chip" data-time="15" onclick="pickChip(this,'time')">15 min</button>
        <button class="chip" data-time="30" onclick="pickChip(this,'time')">30 min</button>
      </div>

      <div class="form-label">你在哪里 Location</div>
      <div class="chip-row">
        <button class="chip" data-loc="home" onclick="pickChip(this,'location')"><span class="chip-emoji">🏠</span> 家 Home</button>
        <button class="chip" data-loc="outside" onclick="pickChip(this,'location')"><span class="chip-emoji">🌳</span> 户外 Outside</button>
        <button class="chip" data-loc="car" onclick="pickChip(this,'location')"><span class="chip-emoji">🚗</span> 车上 Car</button>
        <button class="chip" data-loc="store" onclick="pickChip(this,'location')"><span class="chip-emoji">🏪</span> 商店 Store</button>
        <button class="chip" data-loc="waiting" onclick="pickChip(this,'location')"><span class="chip-emoji">🏫</span> 等候 Waiting</button>
      </div>

      <div class="form-label">有什么可以用的 Materials available</div>
      <div class="chip-row material-chips">
        <button class="chip" data-mat="bubbles" onclick="toggleMaterial(this)">🫧 泡泡</button>
        <button class="chip" data-mat="balls" onclick="toggleMaterial(this)">⚽ 球</button>
        <button class="chip" data-mat="books" onclick="toggleMaterial(this)">📚 书</button>
        <button class="chip" data-mat="playdough" onclick="toggleMaterial(this)">🎨 橡皮泥</button>
        <button class="chip" data-mat="water" onclick="toggleMaterial(this)">💧 水</button>
        <button class="chip" data-mat="music" onclick="toggleMaterial(this)">🎵 音乐</button>
        <button class="chip" data-mat="mirror" onclick="toggleMaterial(this)">🪞 镜子</button>
        <button class="chip" data-mat="nothing" onclick="toggleMaterial(this)">✨ 什么都没有</button>
      </div>

      <button class="recommend-btn" onclick="runRecommend()">给我推荐一个活动 Recommend an activity</button>
    </div>

    <!-- Result -->
    <div id="resultArea" class="hidden"></div>

  </div>

  <!-- ===== BROWSE VIEW ===== -->
  <div id="viewBrowse" class="hidden">

    <div style="margin-bottom:10px;">
      <input type="text" id="browseSearch" placeholder="搜索活动名称 Search activities..." oninput="renderBrowse()" style="width:100%;padding:10px 14px;border:1px solid var(--cream-dark);border-radius:var(--radius-sm);font-size:0.88rem;font-family:inherit;outline:none;background:#fff;color:var(--warm-text);">
    </div>
    <div class="filter-bar">
      <select class="filter-select" id="filterSkill" onchange="renderBrowse()">
        <option value="">全部技能 All Skills</option>
        <option value="Joint Attention">共同注意 Joint Attention</option>
        <option value="Imitation">模仿 Imitation</option>
        <option value="Communication">沟通 Communication</option>
        <option value="Turn-Taking">轮流 Turn-Taking</option>
        <option value="Regulation">调节 Regulation</option>
        <option value="Sensory">感觉 Sensory</option>
        <option value="Play">游戏 Play</option>
      </select>
      <select class="filter-select" id="filterDur" onchange="renderBrowse()">
        <option value="">全部时长 Duration</option>
        <option value="5">5 min</option>
        <option value="10">10 min</option>
        <option value="15">15 min</option>
      </select>
      <select class="filter-select" id="filterLoc" onchange="renderBrowse()">
        <option value="">全部地点 Location</option>
        <option value="indoor">室内 Indoor</option>
        <option value="outdoor">户外 Outdoor</option>
        <option value="car">车/等候 Car/Waiting</option>
      </select>
    </div>

    <div id="browseList"></div>
  </div>

  <!-- ===== HISTORY VIEW ===== -->
  <div id="viewHistory" class="hidden">

    <div class="stats-row" id="historyStats"></div>

    <div class="card">
      <div class="card-title">最近活动 Recent Activities</div>
      <div id="historyList"></div>
    </div>

    <div class="card hidden" id="topActivitiesCard">
      <div class="card-title">最受欢迎 Top 5 Favorites</div>
      <div id="topList"></div>
    </div>
  </div>

</div>

<footer class="footer">
  活动基于 NDBI (自然发展行为干预) 原则设计<br>
  Activities based on Naturalistic Developmental Behavioral Intervention<br>
  <a href="../index.html" style="color:var(--sage);text-decoration:none;">← 返回同路 Back to WithYou</a>
</footer>

<script>
// ===== FULL ACTIVITY DATABASE (60) =====
const ACTIVITIES = [

// ===== STATE =====
const state = {
  mood: null,
  time: null,
  location: null,
  materials: [],
  currentResult: null,
  resultIndex: 0,
  filteredPool: [],
  favorites: JSON.parse(localStorage.getItem('wy_ea_favs') || '[]'),
  history: JSON.parse(localStorage.getItem('wy_ea_history') || '[]'),
};

function getProfile() { return JSON.parse(localStorage.getItem('wy_profile') || 'null'); }

// ===== DARK MODE =====
function toggleDark() {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('wy_dark', dark ? '1' : '0');
  document.getElementById('darkBtn').textContent = dark ? '☀️' : '🌙';
}

// ===== VIEW SWITCHING =====
function switchView(view) {
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('viewRecommend').classList.add('hidden');
  document.getElementById('viewBrowse').classList.add('hidden');
  document.getElementById('viewHistory').classList.add('hidden');

  if (view === 'recommend') {
    document.getElementById('tabRecommend').classList.add('active');
    document.getElementById('viewRecommend').classList.remove('hidden');
  } else if (view === 'browse') {
    document.getElementById('tabBrowse').classList.add('active');
    document.getElementById('viewBrowse').classList.remove('hidden');
    renderBrowse();
  } else {
    document.getElementById('tabHistory').classList.add('active');
    document.getElementById('viewHistory').classList.remove('hidden');
    renderHistory();
  }
}

// ===== CHIP SELECTION =====
function pickChip(el, group) {
  const row = el.parentElement;
  row.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');

  if (group === 'mood') state.mood = el.dataset.mood;
  else if (group === 'time') state.time = parseInt(el.dataset.time);
  else if (group === 'location') state.location = el.dataset.loc;
}

function toggleMaterial(el) {
  el.classList.toggle('active');
  const mat = el.dataset.mat;
  if (mat === 'nothing') {
    state.materials = [];
    document.querySelectorAll('.material-chips .chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    return;
  }
  // Deselect "nothing" if selecting something else
  document.querySelector('.chip[data-mat="nothing"]').classList.remove('active');
  const idx = state.materials.indexOf(mat);
  if (idx >= 0) state.materials.splice(idx, 1);
  else state.materials.push(mat);
}

// ===== RECOMMENDATION ENGINE =====
function runRecommend() {
  const profile = getProfile();
  const age = profile ? profile.childAge : 36;
  const mood = state.mood || 'neutral';
  const time = state.time || 10;
  const location = state.location || 'home';
  const materials = state.materials;

  // Filter by constraints
  let pool = ACTIVITIES.filter(a => {
    // Duration
    if (a.dur > time) return false;
    // Age
    if (age < a.ageMin || age > a.ageMax) return false;
    // Location
    if (location === 'home' && !a.indoor) return false;
    if (location === 'outside' && !a.outdoor) return false;
    if (location === 'car' && !a.car) return false;
    if (location === 'store' && !(a.car || a.waiting || a.indoor)) return false;
    if (location === 'waiting' && !(a.waiting || a.car)) return false;
    return true;
  });

  // Filter by mood suitability (use moods field if present)
  const moodMatched = pool.filter(a => a.moods && a.moods.includes(mood));
  if (moodMatched.length > 0) pool = moodMatched;

  // Mood-based prioritization
  if (mood === 'overwhelmed' || mood === 'upset') {
    const calming = pool.filter(a => a.tags.includes('calming'));
    if (calming.length > 0) pool = calming;
  } else if (mood === 'tired') {
    const calm = pool.filter(a => a.tags.includes('calming') || a.dur <= 5);
    if (calm.length > 0) pool = calm;
  } else if (mood === 'happy') {
    const fun = pool.filter(a => a.tags.includes('social') || a.tags.includes('play'));
    if (fun.length > 0) pool = fun;
  }

  // Boost matching materials
  if (materials.length > 0 && !materials.includes('nothing')) {
    pool.sort((a, b) => {
      const scoreA = a.materials ? a.materials.filter(m => materials.includes(m)).length : 0;
      const scoreB = b.materials ? b.materials.filter(m => materials.includes(m)).length : 0;
      return scoreB - scoreA;
    });
  }

  // Avoid recently tried (last 3 days)
  const recentIds = state.history
    .filter(h => {
      const d = new Date(h.date);
      const now = new Date();
      return (now - d) < 3 * 86400000;
    })
    .map(h => h.id);
  const fresh = pool.filter(a => !recentIds.includes(a.id));
  if (fresh.length > 0) pool = fresh;

  // Shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  state.filteredPool = pool.length > 0 ? pool : ACTIVITIES.slice(0, 5);
  state.resultIndex = 0;
  showResult();
}

function showResult() {
  const a = state.filteredPool[state.resultIndex % state.filteredPool.length];
  state.currentResult = a;

  // Why this activity
  let why = '';
  const mood = state.mood || 'neutral';
  if (mood === 'overwhelmed' || mood === 'upset') {
    why = `孩子现在需要平静 — 这个活动用${a.skillZh}帮助调节 / Your child needs calming — this ${a.skill} activity helps regulate`;
  } else if (mood === 'tired') {
    why = `孩子有点累 — 这是个轻松的${a.skillZh}活动 / Child is tired — this gentle ${a.skill} activity is low-energy`;
  } else if (mood === 'happy') {
    why = `孩子状态不错！正好练习${a.skillZh} / Child is in a good mood! Great time to practice ${a.skill}`;
  } else {
    why = `适合现在的${a.skillZh}练习 / A good ${a.skill} activity for right now`;
  }

  const stepsHtml = a.steps.map((s, i) => `
    <li>
      <span class="step-num">${i+1}</span>
      <div>
        <div class="step-text">${s.zh}</div>
        <div class="step-text-en">${s.en}</div>
      </div>
    </li>
  `).join('');

  const tipHtml = a.tip ? `
    <div class="result-tip">
      💡 <strong>小贴士 Pro tip:</strong> ${a.tip.zh}<br>
      <span style="font-size:0.78rem;color:var(--warm-text-light)">${a.tip.en}</span>
    </div>
  ` : '';

  const isFav = state.favorites.includes(a.id);

  document.getElementById('resultArea').innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-why">${why}</div>
        <div class="result-meta">
          <span class="result-tag">${a.skillIcon} ${a.skillZh}</span>
          <span class="result-tag">${a.dur} min</span>
          <span class="result-tag">${a.indoor ? '🏠 Indoor' : '🌳 Outdoor'}</span>
        </div>
        <div class="result-name">${a.nameZh}</div>
        <div class="result-name-en">${a.nameEn}</div>
      </div>
      <div class="result-body">
        <ul class="result-steps">${stepsHtml}</ul>
        ${tipHtml}
        <div class="result-actions">
          <button class="result-btn primary" onclick="completeActivity()">完成了 Done!</button>
          <button class="result-btn secondary" onclick="showAnother()">换一个 Another</button>
          <button class="result-btn secondary" onclick="toggleFav('${a.id}')" id="favBtn">${isFav ? '★' : '☆'} 收藏</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('resultArea').classList.remove('hidden');
  document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showAnother() {
  state.resultIndex++;
  showResult();
}

function completeActivity() {
  const a = state.currentResult;
  document.getElementById('resultArea').innerHTML = `
    <div class="result-card">
      <div class="celebration">
        <div class="celebration-emoji">🌟</div>
        <div class="celebration-text">太棒了！你练习了${a.skillZh}！</div>
        <div class="celebration-sub">Great job! You practiced ${a.skill} today!</div>
        <div style="margin:16px 0 8px;font-size:0.88rem;">感觉怎样？How did it go?</div>
        <div class="feedback-row">
          <button class="fb-btn" onclick="submitFeedback('${a.id}', 1, this)">👍</button>
          <button class="fb-btn" onclick="submitFeedback('${a.id}', 0, this)">😐</button>
          <button class="fb-btn" onclick="submitFeedback('${a.id}', -1, this)">👎</button>
        </div>
        <input type="text" class="fb-note" id="fbNote" placeholder="备注 Note (optional)">
        <button class="result-btn primary" onclick="finishFeedback()" style="margin-top:8px;">保存 Save</button>
      </div>
    </div>
  `;
}

function submitFeedback(actId, rating, btn) {
  state._pendingFeedback = { id: actId, rating };
  document.querySelectorAll('.fb-btn').forEach(b => b.classList.remove('chosen'));
  btn.classList.add('chosen');
}

function finishFeedback() {
  if (!state._pendingFeedback) return;
  const fb = state._pendingFeedback;
  const note = document.getElementById('fbNote') ? document.getElementById('fbNote').value.trim() : '';

  state.history.unshift({
    id: fb.id,
    rating: fb.rating,
    note: note,
    date: new Date().toISOString()
  });
  localStorage.setItem('wy_ea_history', JSON.stringify(state.history));
  state._pendingFeedback = null;

  // Also save to hub records
  try {
    const records = JSON.parse(localStorage.getItem('wy_records') || '{}');
    const _d = new Date();
    const today = `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
    if (!records[today]) records[today] = {};
    records[today].activityId = fb.id;
    records[today].activityRating = fb.rating;
    records[today].triedActivity = true;
    localStorage.setItem('wy_records', JSON.stringify(records));
  } catch(e) {}

  document.getElementById('resultArea').innerHTML = `
    <div class="card" style="text-align:center;padding:24px;">
      <div style="font-size:1.5rem;margin-bottom:8px;">✅</div>
      <div style="font-weight:600;color:var(--sage-dark);">已保存！继续加油！</div>
      <div style="font-size:0.85rem;color:var(--warm-text-light);margin-bottom:16px;">Saved! Keep going!</div>
      <button class="result-btn primary" onclick="runRecommend()" style="max-width:200px;margin:0 auto;">再来一个 Try another</button>
    </div>
  `;
}

function toggleFav(id) {
  const idx = state.favorites.indexOf(id);
  if (idx >= 0) state.favorites.splice(idx, 1);
  else state.favorites.push(id);
  localStorage.setItem('wy_ea_favs', JSON.stringify(state.favorites));
  const btn = document.getElementById('favBtn');
  if (btn) btn.textContent = (state.favorites.includes(id) ? '★' : '☆') + ' 收藏';
}

// ===== BROWSE VIEW =====
function renderBrowse() {
  const skillFilter = document.getElementById('filterSkill').value;
  const durFilter = document.getElementById('filterDur').value;
  const locFilter = document.getElementById('filterLoc').value;
  const searchTerm = (document.getElementById('browseSearch').value || '').trim().toLowerCase();

  let list = ACTIVITIES.filter(a => {
    if (skillFilter && a.skill !== skillFilter) return false;
    if (durFilter && a.dur > parseInt(durFilter)) return false;
    if (locFilter === 'indoor' && !a.indoor) return false;
    if (locFilter === 'outdoor' && !a.outdoor) return false;
    if (locFilter === 'car' && !a.car && !a.waiting) return false;
    if (searchTerm && !a.nameZh.toLowerCase().includes(searchTerm) && !a.nameEn.toLowerCase().includes(searchTerm) && !a.skillZh.includes(searchTerm) && !a.skill.toLowerCase().includes(searchTerm)) return false;
    return true;
  });

  const iconMap = { 'Joint Attention': 'ja', 'Imitation': 'im', 'Communication': 'co', 'Turn-Taking': 'tt', 'Regulation': 're', 'Sensory': 'se', 'Play': 'pl' };

  const html = list.map(a => {
    const triedCount = state.history.filter(h => h.id === a.id).length;
    const goodCount = state.history.filter(h => h.id === a.id && h.rating === 1).length;
    const isFav = state.favorites.includes(a.id);

    return `
      <div class="browse-card" onclick="browseSelect('${a.id}')">
        <div class="browse-icon ${iconMap[a.skill] || 'ja'}">${a.skillIcon}</div>
        <div class="browse-info">
          <div class="browse-name">${a.nameZh}<span class="browse-name-en"> ${a.nameEn}</span></div>
          <div class="browse-meta">${a.dur} min · ${a.skillZh} · ${a.indoor ? '室内' : ''}${a.outdoor ? '户外' : ''}${a.car ? '车上' : ''}</div>
        </div>
        <div class="browse-stats">
          ${triedCount > 0 ? `<div class="browse-tried">${goodCount}/${triedCount} 👍</div>` : ''}
          <button class="browse-star" onclick="event.stopPropagation();toggleFavBrowse('${a.id}',this)">${isFav ? '★' : '☆'}</button>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('browseList').innerHTML = html || '<div style="text-align:center;padding:24px;color:var(--warm-text-light);">没有匹配的活动 No matching activities</div>';
}

function browseSelect(id) {
  const a = ACTIVITIES.find(x => x.id === id);
  if (!a) return;
  state.filteredPool = [a];
  state.resultIndex = 0;
  state.currentResult = a;
  switchView('recommend');
  // Hide form, show result
  state.mood = 'neutral';
  state.time = a.dur;
  showResult();
}

function toggleFavBrowse(id, btn) {
  const idx = state.favorites.indexOf(id);
  if (idx >= 0) state.favorites.splice(idx, 1);
  else state.favorites.push(id);
  localStorage.setItem('wy_ea_favs', JSON.stringify(state.favorites));
  btn.textContent = state.favorites.includes(id) ? '★' : '☆';
}

// ===== HISTORY VIEW =====
function renderHistory() {
  // Stats
  const totalTried = state.history.length;
  const uniqueTried = [...new Set(state.history.map(h => h.id))].length;
  const goodRatings = state.history.filter(h => h.rating === 1).length;

  // Weekly count
  const weekAgo = new Date();
  weekAgo.setDate(weekAgo.getDate() - 7);
  const thisWeek = state.history.filter(h => new Date(h.date) >= weekAgo).length;

  document.getElementById('historyStats').innerHTML = `
    <div class="stat-box">
      <div class="stat-num">${totalTried}</div>
      <div class="stat-label">总共 Total</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">${uniqueTried}</div>
      <div class="stat-label">不同活动 Unique</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">${thisWeek}</div>
      <div class="stat-label">本周 This week</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">${totalTried > 0 ? Math.round(goodRatings/totalTried*100) : 0}%</div>
      <div class="stat-label">成功率 Success</div>
    </div>
  `;

  // Recent list
  const ratingEmoji = { 1: '👍', 0: '😐', '-1': '👎' };
  const recentHtml = state.history.slice(0, 20).map(h => {
    const a = ACTIVITIES.find(x => x.id === h.id);
    const name = a ? a.nameZh : h.id;
    const date = new Date(h.date);
    const dateStr = `${date.getMonth()+1}/${date.getDate()}`;
    return `
      <div class="history-item">
        <span class="history-date">${dateStr}</span>
        <span class="history-name">${name}</span>
        <span class="history-rating">${ratingEmoji[h.rating] || ''}</span>
      </div>
    `;
  }).join('');

  document.getElementById('historyList').innerHTML = recentHtml || '<div class="history-empty">还没有记录 No history yet<br>去试试一个活动吧！Try an activity!</div>';

  // Top 5
  const counts = {};
  state.history.filter(h => h.rating === 1).forEach(h => {
    counts[h.id] = (counts[h.id] || 0) + 1;
  });
  const top5 = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 5);

  if (top5.length > 0) {
    const topHtml = top5.map(([id, count]) => {
      const a = ACTIVITIES.find(x => x.id === id);
      const name = a ? `${a.nameZh} ${a.nameEn}` : id;
      return `<div class="history-item"><span class="history-date">×${count}</span><span class="history-name">${name}</span><span class="history-rating">⭐</span></div>`;
    }).join('');
    document.getElementById('topList').innerHTML = topHtml;
    document.getElementById('topActivitiesCard').classList.remove('hidden');
  }
}

// ===== INIT =====
function init() {
  if (localStorage.getItem('wy_dark') === '1') {
    document.documentElement.classList.add('dark');
    document.getElementById('darkBtn').textContent = '☀️';
  }

  // Check URL params for mood from hub
  const params = new URLSearchParams(window.location.search);
  if (params.get('mood')) {
    // Map hub mood vocabulary to activity page vocabulary
    const moodMap = { sad: 'upset', angry: 'overwhelmed' };
    state.mood = moodMap[params.get('mood')] || params.get('mood');
    const moodBtn = document.querySelector(`[data-mood="${state.mood}"]`);
    if (moodBtn) moodBtn.classList.add('active');
  }

  // Read child age from hub profile
  const profile = getProfile();
  if (profile && profile.childAge) {
    state.childAge = profile.childAge;
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
