<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就诊准备包 — 同路 WithYou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sage: #6B8F7B;
  --sage-light: #8FB09D;
  --sage-pale: #E8F0EB;
  --sage-dark: #4A6B56;
  --cream: #FAF7F0;
  --cream-dark: #F0EBDF;
  --blue: #7BA7BC;
  --blue-light: #A5C7D6;
  --blue-pale: #E4EFF4;
  --warm-text: #3D3D3D;
  --warm-text-light: #6B6B6B;
  --coral: #D4917B;
  --coral-pale: #F5E0D8;
  --yellow: #C9A84C;
  --yellow-bg: #FDF6E3;
  --shadow: 0 2px 16px rgba(107,143,123,0.10);
  --shadow-lg: 0 6px 28px rgba(107,143,123,0.14);
  --radius: 16px;
  --radius-sm: 10px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--warm-text);
  line-height: 1.6;
  min-height: 100vh;
}

.hidden { display: none !important; }
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; }

/* ===== Top Bar ===== */
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--cream-dark);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar-left { display: flex; align-items: center; gap: 10px; }

.topbar-back {
  color: var(--sage);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}

.topbar-title { font-size: 0.95rem; font-weight: 600; color: var(--sage); }

.topbar-right { display: flex; gap: 8px; }

.lang-toggle {
  background: var(--sage-pale);
  border: none;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--sage);
  cursor: pointer;
  transition: all 0.2s;
}
.lang-toggle:hover { background: var(--sage-light); color: #fff; }
.lang-toggle.active { background: var(--sage); color: #fff; }

/* ===== Hero ===== */
.hero {
  text-align: center;
  padding: 32px 20px 24px;
}
.hero-icon { font-size: 2.8rem; margin-bottom: 10px; }
.hero h1 { font-size: 1.5rem; font-weight: 700; color: var(--sage-dark); margin-bottom: 4px; }
.hero p { font-size: 0.92rem; color: var(--warm-text-light); max-width: 500px; margin: 0 auto; }

/* ===== Country Tabs ===== */
.country-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 12px 20px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.country-tabs::-webkit-scrollbar { display: none; }

.country-tab {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 24px;
  border: 1.5px solid var(--cream-dark);
  background: #fff;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--warm-text-light);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.country-tab:hover { border-color: var(--sage-light); color: var(--sage); }
.country-tab.active {
  background: var(--sage);
  color: #fff;
  border-color: var(--sage);
}
.country-tab .flag { font-size: 1.1rem; }

/* ===== Section Tabs ===== */
.section-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 20px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.section-tabs::-webkit-scrollbar { display: none; }

.section-tab {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  background: var(--cream-dark);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--warm-text-light);
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.section-tab:hover { background: var(--sage-pale); color: var(--sage); }
.section-tab.active { background: var(--blue); color: #fff; }

/* ===== Content Area ===== */
.content-area { padding: 16px 0 80px; }

.card {
  background: #fff;
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card h3 {
  font-size: 1rem;
  font-weight: 600;
  color: var(--sage-dark);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card h3 .icon { font-size: 1.2rem; }

/* ===== Pathway ===== */
.pathway-steps {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.pathway-step {
  display: flex;
  gap: 14px;
  padding: 12px 0;
}
.step-marker {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}
.step-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--sage);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
}
.step-line {
  flex: 1;
  width: 2px;
  background: var(--sage-pale);
  min-height: 20px;
}
.step-content h4 {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--warm-text);
  margin-bottom: 4px;
}
.step-content p {
  font-size: 0.84rem;
  color: var(--warm-text-light);
  line-height: 1.5;
}

/* ===== Checklist ===== */
.checklist { list-style: none; }
.checklist li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--cream-dark);
  font-size: 0.88rem;
  cursor: pointer;
  transition: opacity 0.2s;
}
.checklist li:last-child { border-bottom: none; }
.checklist li.checked { opacity: 0.55; text-decoration: line-through; }

.checkbox {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid var(--sage-light);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  margin-top: 1px;
}
.checkbox.checked {
  background: var(--sage);
  border-color: var(--sage);
  color: #fff;
}

.check-progress {
  background: var(--sage-pale);
  border-radius: 10px;
  height: 6px;
  margin-top: 14px;
  overflow: hidden;
}
.check-progress-bar {
  height: 100%;
  background: var(--sage);
  border-radius: 10px;
  transition: width 0.4s ease;
}
.check-count {
  font-size: 0.78rem;
  color: var(--warm-text-light);
  margin-top: 6px;
  text-align: right;
}

/* ===== Assessment Info ===== */
.assess-block {
  background: var(--blue-pale);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 10px;
}
.assess-block h4 {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 6px;
}
.assess-block p, .assess-block li {
  font-size: 0.84rem;
  color: var(--warm-text-light);
  line-height: 1.55;
}
.assess-block ul { padding-left: 16px; margin-top: 6px; }
.assess-block ul li { margin-bottom: 4px; }

/* ===== Questions ===== */
.question-list { list-style: none; counter-reset: q; }
.question-list li {
  padding: 10px 0;
  border-bottom: 1px solid var(--cream-dark);
  font-size: 0.88rem;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.question-list li:last-child { border-bottom: none; }
.q-num {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--coral-pale);
  color: var(--coral);
  font-size: 0.72rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== Behavior Summary Form ===== */
.form-section { margin-bottom: 16px; }
.form-label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--sage-dark);
  margin-bottom: 6px;
  display: block;
}
.form-input, .form-textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--cream-dark);
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-family: inherit;
  color: var(--warm-text);
  background: #fff;
  transition: border-color 0.2s;
}
.form-input:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--sage-light);
}
.form-textarea { min-height: 80px; resize: vertical; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn-print {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 12px 24px;
  background: var(--sage);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 10px;
}
.btn-print:hover { background: var(--sage-dark); }

.btn-save {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 12px 24px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 10px;
  margin-left: 8px;
}
.btn-save:hover { background: #6894A8; }

.form-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

/* ===== Print ===== */
@media print {
  .topbar, .country-tabs, .section-tabs, .btn-print, .btn-save, .form-actions { display: none !important; }
  .card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
  body { background: #fff; }
  .content-area { padding: 0; }
  .print-header { display: block !important; text-align: center; margin-bottom: 20px; }
  .print-header h2 { font-size: 1.2rem; }
}

.print-header { display: none; }

/* ===== Responsive ===== */
@media (max-width: 480px) {
  .form-row { grid-template-columns: 1fr; }
  .hero h1 { font-size: 1.3rem; }
}
</style>
</head>

// ===== State =====
let currentLang = localStorage.getItem('withyou-lang') || 'zh';
let currentCountry = 'CN';
let currentSection = 'pathway';
let checklistState = JSON.parse(localStorage.getItem('withyou-appt-checklist') || '{}');
let formData = JSON.parse(localStorage.getItem('withyou-appt-form') || '{}');

// ===== Language Toggle =====
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('withyou-lang', lang);
  document.querySelectorAll('.lang-toggle').forEach(b => b.classList.toggle('active', b.textContent.trim() === (lang === 'zh' ? '中文' : 'EN')));
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = el.getAttribute('data-' + lang);
  });
  renderContent();
}

// ===== Country Tabs =====
document.getElementById('countryTabs').addEventListener('click', e => {
  const tab = e.target.closest('.country-tab');
  if (!tab) return;
  document.querySelectorAll('.country-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentCountry = tab.dataset.country;
  renderContent();
});

// ===== Section Tabs =====
document.getElementById('sectionTabs').addEventListener('click', e => {
  const tab = e.target.closest('.section-tab');
  if (!tab) return;
  document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentSection = tab.dataset.section;
  renderContent();
});

// ===== Render =====
function renderContent() {
  const area = document.getElementById('contentArea');
  const d = DATA[currentCountry];
  const lang = currentLang;

  if (currentSection === 'pathway') {
    const steps = d.pathway[lang];
    area.innerHTML = `<div class="card"><h3><span class="icon">&#128506;</span> ${lang === 'zh' ? '诊断路径' : 'Diagnostic Pathway'}</h3><div class="pathway-steps">${steps.map((s, i) => `
      <div class="pathway-step">
        <div class="step-marker"><div class="step-dot">${i + 1}</div>${i < steps.length - 1 ? '<div class="step-line"></div>' : ''}</div>
        <div class="step-content"><h4>${s.title}</h4><p>${s.desc}</p></div>
      </div>`).join('')}</div></div>`;
  }

  else if (currentSection === 'checklist') {
    const items = d.checklist[lang];
    const key = currentCountry;
    if (!checklistState[key]) checklistState[key] = {};
    const checked = Object.values(checklistState[key]).filter(Boolean).length;
    area.innerHTML = `<div class="card"><h3><span class="icon">&#9989;</span> ${lang === 'zh' ? '携带清单' : 'What to Bring'}</h3>
      <ul class="checklist">${items.map((item, i) => {
        const isChecked = checklistState[key][i];
        return `<li class="${isChecked ? 'checked' : ''}" data-idx="${i}"><div class="checkbox ${isChecked ? 'checked' : ''}">${isChecked ? '&#10003;' : ''}</div><span>${item}</span></li>`;
      }).join('')}</ul>
      <div class="check-progress"><div class="check-progress-bar" style="width:${items.length ? (checked/items.length*100) : 0}%"></div></div>
      <div class="check-count">${checked}/${items.length} ${lang === 'zh' ? '已准备' : 'prepared'}</div>
    </div>`;

    area.querySelector('.checklist').addEventListener('click', e => {
      const li = e.target.closest('li');
      if (!li) return;
      const idx = li.dataset.idx;
      checklistState[key][idx] = !checklistState[key][idx];
      localStorage.setItem('withyou-appt-checklist', JSON.stringify(checklistState));
      renderContent();
    });
  }

        <div class="form-section"><label class="form-label">${labels.filledBy}</label><input class="form-input" data-field="filledBy" value="${fd.filledBy || ''}"></div>
      </div>
      <div class="form-section"><label class="form-label">${labels.filledDate}</label><input class="form-input" type="date" data-field="filledDate" value="${fd.filledDate || ''}"></div>

      <h3 style="margin-top:20px"><span class="icon">&#128483;</span> ${labels.commTitle}</h3>
      <div class="form-section"><label class="form-label">${labels.commQ1}</label><textarea class="form-textarea" data-field="commQ1">${fd.commQ1 || ''}</textarea></div>
      <div class="form-section"><label class="form-label">${labels.commQ2}</label><textarea class="form-textarea" data-field="commQ2">${fd.commQ2 || ''}</textarea></div>
      <div class="form-section"><label class="form-label">${labels.commQ3}</label><textarea class="form-textarea" data-field="commQ3">${fd.commQ3 || ''}</textarea></div>
      <div class="form-section"><label class="form-label">${labels.commQ4}</label><textarea class="form-textarea" data-field="commQ4">${fd.commQ4 || ''}</textarea></div>

      <h3 style="margin-top:20px"><span class="icon">&#128260;</span> ${labels.behTitle}</h3>
      <div class="form-section"><label class="form-label">${labels.behQ1}</label><textarea class="form-textarea" data-field="behQ1">${fd.behQ1 || ''}</textarea></div>
      <div class="form-section"><label class="form-label">${labels.behQ2}</label><textarea class="form-textarea" data-field="behQ2">${fd.behQ2 || ''}</textarea></div>
      <div class="form-section"><label class="form-label">${labels.behQ3}</label><textarea class="form-textarea" data-field="behQ3">${fd.behQ3 || ''}</textarea></div>
      <div class="form-section"><label class="form-label">${labels.behQ4}</label><textarea class="form-textarea" data-field="behQ4">${fd.behQ4 || ''}</textarea></div>

      <h3 style="margin-top:20px"><span class="icon">&#127968;</span> ${labels.dailyTitle}</h3>
      <div class="form-section"><label class="form-label">${labels.dailyQ1}</label><textarea class="form-textarea" data-field="dailyQ1">${fd.dailyQ1 || ''}</textarea></div>
      <div class="form-section"><label class="form-label">${labels.dailyQ2}</label><textarea class="form-textarea" data-field="dailyQ2">${fd.dailyQ2 || ''}</textarea></div>
      <div class="form-section"><label class="form-label">${labels.dailyQ3}</label><textarea class="form-textarea" data-field="dailyQ3">${fd.dailyQ3 || ''}</textarea></div>
      <div class="form-section"><label class="form-label">${labels.dailyQ4}</label><textarea class="form-textarea" data-field="dailyQ4">${fd.dailyQ4 || ''}</textarea></div>

      <div class="form-section"><label class="form-label">${labels.concerns}</label><textarea class="form-textarea" data-field="concerns" style="min-height:100px">${fd.concerns || ''}</textarea></div>
      <div class="form-section"><label class="form-label">${labels.strengths}</label><textarea class="form-textarea" data-field="strengths" style="min-height:100px">${fd.strengths || ''}</textarea></div>

      <div class="form-actions">
        <button class="btn-print" onclick="window.print()">&#128424; ${labels.print}</button>
        <button class="btn-save" id="saveBtn">&#128190; ${labels.save}</button>
      </div>
    </div>`;

    // Auto-save on input
    area.querySelectorAll('.form-input, .form-textarea').forEach(input => {
      input.addEventListener('input', () => {
        if (!formData[fk]) formData[fk] = {};
        formData[fk][input.dataset.field] = input.value;
      });
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      localStorage.setItem('withyou-appt-form', JSON.stringify(formData));
      const btn = document.getElementById('saveBtn');
      const orig = btn.innerHTML;
      btn.innerHTML = lang === 'zh' ? '&#10003; 已保存' : '&#10003; Saved';
      btn.style.background = 'var(--sage)';
      setTimeout(() => { btn.innerHTML = orig; btn.style.background = ''; }, 1500);
    });
  }
}

// ===== Init =====
setLang(currentLang);
</script>
</body>
</html>
