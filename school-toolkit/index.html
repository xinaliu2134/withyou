<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学校工具包 — 同路 WithYou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sage: #6B8F7B;
  --sage-light: #8FB09D;
  --sage-pale: #E8F0EB;
  --sage-dark: #4A6B56;
  --cream: #FAF7F0;
  --cream-dark: #F0EBDF;
  --blue: #7BA7BC;
  --blue-light: #A5C7D6;
  --blue-pale: #E4EFF4;
  --warm-text: #3D3D3D;
  --warm-text-light: #6B6B6B;
  --coral: #D4917B;
  --coral-pale: #F5E0D8;
  --yellow: #C9A84C;
  --yellow-bg: #FDF6E3;
  --red: #C47A6E;
  --red-bg: #F8E8E5;
  --green-bg: #E8F0EB;
  --shadow: 0 2px 16px rgba(107,143,123,0.10);
  --shadow-lg: 0 6px 28px rgba(107,143,123,0.14);
  --radius: 16px;
  --radius-sm: 10px;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--warm-text);
  line-height: 1.6;
  min-height: 100vh;
}
.hidden { display: none !important; }

/* ===== Top Bar ===== */
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--cream-dark);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-back { color: var(--sage); text-decoration: none; font-size: 0.88rem; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.topbar-title { font-size: 0.95rem; font-weight: 600; color: var(--sage); }
.lang-toggle {
  background: var(--sage-pale); border: none; border-radius: 20px; padding: 4px 12px;
  font-size: 0.78rem; font-weight: 500; color: var(--sage); cursor: pointer; transition: background 0.2s;
}
.lang-toggle:hover { background: var(--sage-light); color: #fff; }

/* ===== Tabs ===== */
.tabs {
  display: flex; gap: 4px; padding: 16px 20px 0; max-width: 680px; margin: 0 auto;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab {
  padding: 10px 14px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  font-size: 0.78rem; font-weight: 500; background: var(--cream-dark);
  color: var(--warm-text-light); border: none; cursor: pointer; white-space: nowrap; transition: all 0.2s;
}
.tab.active { background: #fff; color: var(--sage); font-weight: 600; }

/* ===== Panel ===== */
.panel {
  background: #fff; border-radius: 0 0 var(--radius) var(--radius);
  padding: 24px 20px; margin: 0 auto; max-width: 680px; min-height: 400px; box-shadow: var(--shadow);
}

/* ===== Card ===== */
.card {
  background: #fff; border: 1px solid var(--cream-dark); border-radius: var(--radius-sm);
  padding: 16px; margin-bottom: 12px;
}
.card-title { font-size: 0.92rem; font-weight: 600; color: var(--sage-dark); margin-bottom: 8px; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 24px; border-radius: var(--radius-sm); font-size: 0.92rem;
  font-weight: 600; font-family: inherit; border: none; cursor: pointer; transition: all 0.2s;
}
.btn-primary { background: var(--sage); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--sage-dark); }
.btn-secondary { background: #fff; color: var(--sage); border: 2px solid var(--sage-pale); }
.btn-secondary:hover { background: var(--sage-pale); }
.btn-small { padding: 8px 16px; font-size: 0.82rem; }

/* ===== Form ===== */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--warm-text); }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 12px 14px; border: 2px solid var(--cream-dark);
  border-radius: var(--radius-sm); font-size: 0.92rem; font-family: inherit;
  color: var(--warm-text); background: #fff; outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--sage-light); }
.form-textarea { resize: vertical; min-height: 80px; }

/* ===== Country tabs ===== */
.country-tabs {
  display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap;
}
.country-tab {
  padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 500;
  background: var(--cream); border: 2px solid var(--cream-dark); color: var(--warm-text-light);
  cursor: pointer; transition: all 0.2s;
}
.country-tab.active { background: var(--sage-pale); border-color: var(--sage); color: var(--sage-dark); }

/* ===== Rights info ===== */
.rights-block { margin-bottom: 16px; }
.rights-term {
  font-weight: 600; font-size: 0.88rem; color: var(--sage-dark);
  padding: 8px 0 4px; border-bottom: 1px solid var(--cream-dark); margin-bottom: 6px;
}
.rights-desc { font-size: 0.85rem; line-height: 1.6; color: var(--warm-text); margin-bottom: 12px; }

/* ===== Goal bank ===== */
.goal-domain-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.domain-tab {
  padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 500;
  background: var(--cream); border: 2px solid var(--cream-dark); color: var(--warm-text-light);
  cursor: pointer; transition: all 0.2s;
}
.domain-tab.active { background: var(--blue-pale); border-color: var(--blue); color: var(--blue); }

.goal-item {
  padding: 12px 14px; background: var(--cream); border-radius: var(--radius-sm);
  margin-bottom: 8px; font-size: 0.85rem; line-height: 1.55;
}
.goal-baseline { font-size: 0.78rem; color: var(--warm-text-light); margin-top: 4px; }

/* ===== Checklist ===== */
.checklist-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--cream-dark); font-size: 0.88rem;
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item input[type="checkbox"] {
  width: 20px; height: 20px; margin-top: 2px; accent-color: var(--sage); flex-shrink: 0;
}
.checklist-section { font-weight: 600; color: var(--sage-dark); padding: 12px 0 6px; font-size: 0.88rem; }

/* ===== Templates ===== */
.template-selector { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.template-btn {
  padding: 8px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 500;
  background: var(--cream); border: 2px solid var(--cream-dark); color: var(--warm-text-light);
  cursor: pointer; transition: all 0.2s;
}
.template-btn.active { background: var(--coral-pale); border-color: var(--coral); color: var(--coral); }

.template-content {
  background: var(--cream); border-radius: var(--radius-sm); padding: 16px;
  font-size: 0.85rem; line-height: 1.7; white-space: pre-wrap; margin-bottom: 16px;
}
.template-field {
  background: var(--yellow-bg); padding: 2px 8px; border-radius: 4px; border-bottom: 2px dashed var(--yellow);
  cursor: text;
}

/* ===== Teacher card ===== */
.teacher-card {
  background: #fff; border: 2px solid var(--sage); border-radius: var(--radius);
  padding: 20px; max-width: 480px; margin: 0 auto;
}
.tc-header { text-align: center; margin-bottom: 16px; }
.tc-header h3 { color: var(--sage-dark); font-size: 1rem; }
.tc-row { display: flex; gap: 12px; margin-bottom: 12px; }
.tc-row .form-group { flex: 1; margin-bottom: 0; }
.tc-label { font-size: 0.78rem; font-weight: 600; color: var(--sage); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

/* ===== Search ===== */
.search-bar { margin-bottom: 16px; }

.section-title { font-size: 1.05rem; font-weight: 600; color: var(--sage-dark); margin-bottom: 8px; }
.section-sub { font-size: 0.82rem; color: var(--warm-text-light); margin-bottom: 16px; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--warm-text-light); font-size: 0.92rem; }
.empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }

@media print {
  .topbar, .tabs, .btn, .search-bar, .country-tabs, .goal-domain-tabs, .template-selector { display: none !important; }
  .panel { box-shadow: none; border: 1px solid #ddd; }
  .teacher-card { border: 2px solid #333; page-break-inside: avoid; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">&#8592; <span data-i18n="back">返回</span></a>
    <span class="topbar-title" data-i18n="title">学校工具包</span>
  </div>
  <button class="lang-toggle" onclick="toggleLang()">EN / 中</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('rights')" data-i18n="tab_rights">各国权利</button>
  <button class="tab" onclick="showTab('goals')" data-i18n="tab_goals">IEP目标库</button>
  <button class="tab" onclick="showTab('meeting')" data-i18n="tab_meeting">会议准备</button>
  <button class="tab" onclick="showTab('letters')" data-i18n="tab_letters">信函模板</button>
  <button class="tab" onclick="showTab('teacher')" data-i18n="tab_teacher">教师卡</button>
</div>

<!-- ==================== RIGHTS PANEL ==================== -->
<div class="panel" id="panel-rights">
  <div class="section-title" data-i18n="rights_title">各国特殊教育权利</div>
  <p class="section-sub" data-i18n="rights_sub">了解您所在国家的特殊教育法规与权利</p>
  <div class="country-tabs" id="country-tabs"></div>
  <div id="rights-content"></div>
</div>

<!-- ==================== IEP GOALS PANEL ==================== -->
<div class="panel hidden" id="panel-goals">
  <div class="section-title" data-i18n="goals_title">IEP目标库</div>
  <p class="section-sub" data-i18n="goals_sub">可量化的IEP目标，包含基线与目标格式</p>
  <div class="search-bar">
    <input class="form-input" id="goal-search" placeholder="" oninput="renderGoals()">
  </div>
  <div class="goal-domain-tabs" id="domain-tabs"></div>
  <div id="goals-list"></div>
</div>

<!-- ==================== MEETING PREP PANEL ==================== -->
<div class="panel hidden" id="panel-meeting">
  <div class="section-title" data-i18n="meeting_title">会议准备清单</div>
  <p class="section-sub" data-i18n="meeting_sub">IEP会议前、中、后的完整检查清单</p>
  <div id="meeting-checklist"></div>
</div>

<!-- ==================== LETTERS PANEL ==================== -->
<div class="panel hidden" id="panel-letters">
  <div class="section-title" data-i18n="letters_title">信函模板</div>
  <p class="section-sub" data-i18n="letters_sub">可填写、可打印的标准信函</p>
  <div class="template-selector" id="template-tabs"></div>
  <div id="letter-content"></div>
  <button class="btn btn-primary" onclick="window.print()" data-i18n="print">打印</button>
</div>

<!-- ==================== TEACHER CARD PANEL ==================== -->
<div class="panel hidden" id="panel-teacher">
  <div class="section-title" data-i18n="tc_title">教师沟通卡</div>
  <p class="section-sub" data-i18n="tc_sub">一页式可填写、可打印的教师沟通卡</p>
  <div class="teacher-card" id="teacher-card-form">
    <div class="tc-header"><h3 data-i18n="tc_heading">我的孩子 — 教师须知</h3></div>
    <div class="tc-row">
      <div class="form-group"><div class="tc-label" data-i18n="tc_name">姓名</div><input class="form-input" id="tc-name" oninput="saveTeacherCard()"></div>
      <div class="form-group"><div class="tc-label" data-i18n="tc_diagnosis">诊断</div><input class="form-input" id="tc-diagnosis" oninput="saveTeacherCard()"></div>
    </div>
    <div class="form-group"><div class="tc-label" data-i18n="tc_needs">关键需求</div><textarea class="form-textarea" id="tc-needs" rows="2" oninput="saveTeacherCard()"></textarea></div>
    <div class="form-group"><div class="tc-label" data-i18n="tc_comm_style">沟通方式</div><textarea class="form-textarea" id="tc-comm" rows="2" oninput="saveTeacherCard()"></textarea></div>
    <div class="form-group"><div class="tc-label" data-i18n="tc_sensory">感觉需求</div><textarea class="form-textarea" id="tc-sensory" rows="2" oninput="saveTeacherCard()"></textarea></div>
    <div class="form-group"><div class="tc-label" data-i18n="tc_triggers">触发因素</div><textarea class="form-textarea" id="tc-triggers" rows="2" oninput="saveTeacherCard()"></textarea></div>
    <div class="form-group"><div class="tc-label" data-i18n="tc_calming">安抚策略</div><textarea class="form-textarea" id="tc-calming" rows="2" oninput="saveTeacherCard()"></textarea></div>
    <div class="tc-row">
      <div class="form-group"><div class="tc-label" data-i18n="tc_emergency1">紧急联系人1</div><input class="form-input" id="tc-em1" oninput="saveTeacherCard()"></div>
      <div class="form-group"><div class="tc-label" data-i18n="tc_emergency2">紧急联系人2</div><input class="form-input" id="tc-em2" oninput="saveTeacherCard()"></div>
    </div>
  </div>
  <div style="height:16px;"></div>
  <button class="btn btn-primary" onclick="window.print()" data-i18n="print_card">打印教师卡</button>
</div>

<div style="height:40px;"></div>

<script>
// ===================================================================
//  I18N
// ===================================================================
let lang = 'zh';
const I18N = {
  zh: {
    back: '返回', title: '学校工具包',
    tab_rights: '各国权利', tab_goals: 'IEP目标库', tab_meeting: '会议准备', tab_letters: '信函模板', tab_teacher: '教师卡',
    rights_title: '各国特殊教育权利', rights_sub: '了解您所在国家的特殊教育法规与权利',
    goals_title: 'IEP目标库', goals_sub: '可量化的IEP目标，包含基线与目标格式',
    meeting_title: '会议准备清单', meeting_sub: 'IEP会议前、中、后的完整检查清单',
    letters_title: '信函模板', letters_sub: '可填写、可打印的标准信函',
    tc_title: '教师沟通卡', tc_sub: '一页式可填写、可打印的教师沟通卡',
    save: '保存', cancel: '取消', print: '打印', print_card: '打印教师卡',
    search_goals: '搜索目标...',
    tc_heading: '我的孩子 — 教师须知',
    tc_name: '姓名', tc_diagnosis: '诊断', tc_needs: '关键需求', tc_comm_style: '沟通方式',
    tc_sensory: '感觉需求', tc_triggers: '触发因素', tc_calming: '安抚策略',
    tc_emergency1: '紧急联系人1', tc_emergency2: '紧急联系人2',
    dom_social: '社交', dom_comm: '沟通', dom_behavior: '行为', dom_academic: '学业', dom_daily: '日常生活',
    tpl_eval: '请求评估', tpl_iep: '请求IEP会议', tpl_disagree: '不同意通知', tpl_accomm: '请求调整', tpl_followup: '后续跟进',
    pre_meeting: '会议前', during_meeting: '会议中', post_meeting: '会议后',
    baseline: '基线', target: '目标',
    ref_note: '参考: IDEA 2004; Wrightslaw'
  },
  en: {
    back: 'Back', title: 'School & IEP Toolkit',
    tab_rights: 'Rights', tab_goals: 'IEP Goals', tab_meeting: 'Meeting Prep', tab_letters: 'Letters', tab_teacher: 'Teacher Card',
    rights_title: 'Special Education Rights by Country', rights_sub: 'Know your rights in your country',
    goals_title: 'IEP Goal Bank', goals_sub: 'Measurable goals with baseline/target format',
    meeting_title: 'Meeting Prep Checklist', meeting_sub: 'Complete checklist for before, during, and after IEP meetings',
    letters_title: 'Template Letters', letters_sub: 'Fillable, printable standard letters',
    tc_title: 'Teacher Communication Card', tc_sub: 'One-page fillable, printable teacher communication card',
    save: 'Save', cancel: 'Cancel', print: 'Print', print_card: 'Print Teacher Card',
    search_goals: 'Search goals...',
    tc_heading: 'About My Child — For Teachers',
    tc_name: 'Name', tc_diagnosis: 'Diagnosis', tc_needs: 'Key Needs', tc_comm_style: 'Communication Style',
    tc_sensory: 'Sensory Needs', tc_triggers: 'Triggers', tc_calming: 'Calming Strategies',
    tc_emergency1: 'Emergency Contact 1', tc_emergency2: 'Emergency Contact 2',
    dom_social: 'Social', dom_comm: 'Communication', dom_behavior: 'Behavior', dom_academic: 'Academic', dom_daily: 'Daily Living',
    tpl_eval: 'Request Evaluation', tpl_iep: 'Request IEP Meeting', tpl_disagree: 'Disagreement Notice', tpl_accomm: 'Request Accommodations', tpl_followup: 'Follow-Up',
    pre_meeting: 'Before Meeting', during_meeting: 'During Meeting', post_meeting: 'After Meeting',
    baseline: 'Baseline', target: 'Target',
    ref_note: 'References: IDEA 2004; Wrightslaw'
  }
};

function t(key) { return I18N[lang][key] || key; }
function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (I18N[lang][k]) el.textContent = I18N[lang][k];
  });
  const gs = document.getElementById('goal-search');
  if (gs) gs.placeholder = t('search_goals');
}
function toggleLang() { lang = lang === 'zh' ? 'en' : 'zh'; applyLang(); renderAll(); }

// ===================================================================
//  DATA
// ===================================================================
const STORAGE_KEY = 'withyou_school';
let data = { checklist: {}, teacherCard: {} };
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function load() { const s = localStorage.getItem(STORAGE_KEY); if (s) { try { data = JSON.parse(s); } catch(e) {} } }

// ===================================================================
//  TABS
// ===================================================================
const TABS = ['rights','goals','meeting','letters','teacher'];
let activeTab = 'rights';
function showTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', TABS[i] === tab));
  TABS.forEach(p => document.getElementById('panel-' + p).classList.toggle('hidden', p !== tab));
  renderAll();
}

// ===================================================================
//  RIGHTS BY COUNTRY
// ===================================================================
const COUNTRIES = ['US','NL','UK','DE','FR','CN'];
let activeCountry = 'US';

const RIGHTS = {
  US: {
    zh: [
      { term: 'IDEA (残障人士教育法)', desc: '联邦法律，保障3-21岁残障儿童获得免费适当的公共教育(FAPE)。学校必须为符合条件的学生制定个别化教育计划(IEP)。' },
      { term: 'IEP (个别化教育计划)', desc: '为每个符合条件的残障学生量身定制的书面教育计划。包括当前表现水平、年度目标、所需服务和支持。家长是IEP团队的平等成员。' },
      { term: '504计划', desc: '为不符合IDEA但需要调整的学生提供的计划。基于1973年康复法案第504条。可包括延长考试时间、优先座位等调整。' },
      { term: 'FAPE (免费适当公共教育)', desc: '所有残障儿童有权获得免费的、适合其需求的公共教育，无论残障的性质或程度如何。' },
      { term: 'LRE (最少限制环境)', desc: '残障学生应尽可能与非残障同龄人一起接受教育。只有在使用辅助和服务后仍无法在普通课堂取得令人满意的教育效果时，才可以将学生安置在更具限制性的环境中。' }
    ],
    en: [
      { term: 'IDEA (Individuals with Disabilities Education Act)', desc: 'Federal law ensuring free appropriate public education (FAPE) for children with disabilities ages 3-21. Schools must develop an IEP for eligible students.' },
      { term: 'IEP (Individualized Education Program)', desc: 'A written plan tailored for each eligible student with a disability. Includes present levels, annual goals, services, and supports. Parents are equal members of the IEP team.' },
      { term: '504 Plan', desc: 'For students who need accommodations but do not qualify under IDEA. Based on Section 504 of the Rehabilitation Act of 1973. Can include extended time, preferential seating, etc.' },
      { term: 'FAPE (Free Appropriate Public Education)', desc: 'All children with disabilities are entitled to a free public education appropriate to their needs, regardless of the nature or severity of disability.' },
      { term: 'LRE (Least Restrictive Environment)', desc: 'Students with disabilities should be educated with non-disabled peers to the maximum extent appropriate. Removal from regular classes only when education cannot be achieved satisfactorily with supplementary aids and services.' }
    ]
  },
  NL: {
    zh: [
      { term: 'Passend Onderwijs (适切教育)', desc: '2014年荷兰法律，要求学校为每个学生提供适合其需求的教育。学校有"照顾义务"(zorgplicht)为有特殊需求的学生寻找合适的教育场所。' },
      { term: 'SBO (特殊基础教育)', desc: '为需要额外支持但不需要特殊学校的学生提供的小班教学。班级更小，更多个别关注。' },
      { term: 'SO (特殊教育)', desc: '为有严重身体、智力或行为障碍的学生提供的专门学校。分为四个类别(cluster 1-4)。' },
      { term: 'Samenwerkingsverband', desc: '区域学校合作组织，管理特殊教育预算和资源分配。负责批准额外支持和安置决定。' },

function renderRights() {
  const tabs = document.getElementById('country-tabs');
  tabs.innerHTML = COUNTRIES.map(c =>
    `<span class="country-tab ${activeCountry === c ? 'active' : ''}" onclick="activeCountry='${c}';renderRights()">${c}</span>`
  ).join('');

  const items = RIGHTS[activeCountry]?.[lang] || RIGHTS[activeCountry]?.en || [];
  document.getElementById('rights-content').innerHTML = items.map(r =>
    `<div class="rights-block"><div class="rights-term">${r.term}</div><div class="rights-desc">${r.desc}</div></div>`
  ).join('');
}

function renderGoals() {
  const tabs = document.getElementById('domain-tabs');
  tabs.innerHTML = DOMAINS.map(d =>
    `<span class="domain-tab ${activeDomain === d ? 'active' : ''}" onclick="activeDomain='${d}';renderGoals()">${t(d)}</span>`
  ).join('');

  const search = (document.getElementById('goal-search')?.value || '').toLowerCase();
  let goals = GOALS[activeDomain]?.[lang] || GOALS[activeDomain]?.en || [];
  if (search) goals = goals.filter(g => g.g.toLowerCase().includes(search));

  document.getElementById('goals-list').innerHTML = goals.map(g =>
    `<div class="goal-item">
      <div>${g.g}</div>
      <div class="goal-baseline"><strong>${t('baseline')}:</strong> ${g.b} → <strong>${t('target')}:</strong> ${g.tgt}</div>
    </div>`
  ).join('') || `<div class="empty-state">${lang === 'zh' ? '没有匹配的目标' : 'No matching goals'}</div>`;
}

function renderChecklist() {
  const sections = ['pre_meeting','during_meeting','post_meeting'];
  const items = CHECKLIST[lang] || CHECKLIST.en;
  let html = '';
  sections.forEach(sec => {
    html += `<div class="checklist-section">${t(sec)}</div>`;
    items[sec].forEach((item, i) => {
      const key = sec + '_' + i;
      const checked = data.checklist[key] ? 'checked' : '';
      html += `<div class="checklist-item">
        <input type="checkbox" ${checked} onchange="toggleCheck('${key}',this.checked)">
        <span>${item}</span>
      </div>`;
    });
  });
  document.getElementById('meeting-checklist').innerHTML = html;
}

function toggleCheck(key, val) {
  data.checklist[key] = val;
  save();
}
